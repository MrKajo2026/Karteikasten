<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Karteikasten">
<title>Karteikasten</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Nordic Calm: Leinen-Grund, Salbei als einziger Akzent, Honig für Fortschritt. Serif für Begriffe und Titel, Grotesk für alles andere. Eine ruhige Spalte, schwebende Navigation. */
:root{
  --bg:#f4f1ec; --surface:#ffffff; --sunk:#ece6dc; --line:#e5dfd5; --fg:#24302a; --muted:#68736c;
  --ink:#3f5e4c; --ink-soft:#e6ece6; --on-ink:#f4f1ec; --mark:#e0b878; --ok:#3f6e52; --ok-soft:#e3ede5; --bad:#a9503b; --bad-soft:#f6e6df; --warn:#9a6a34; --warn-soft:#f7eee3;
  --hero:#3f5e4c; --hero-fg:#f4f1ec; --hero-mute:#c9d8cd;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",ui-sans-serif,system-ui,sans-serif;
  --r:22px; --nav:68px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151b18; --surface:#1d2521; --sunk:#252e29; --line:#2f3934; --fg:#ece8e1; --muted:#a2ada6;
  --ink:#9cbca8; --ink-soft:#28372f; --on-ink:#151b18; --mark:#d9b37a; --ok:#8fc2a0; --ok-soft:#21352a; --bad:#e3907c; --bad-soft:#3b2620; --warn:#d9a868; --warn-soft:#3a2f20;
  --hero:#2c4537; --hero-fg:#ece8e1; --hero-mute:#a9c2b2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151b18; --surface:#1d2521; --sunk:#252e29; --line:#2f3934; --fg:#ece8e1; --muted:#a2ada6;
  --ink:#9cbca8; --ink-soft:#28372f; --on-ink:#151b18; --mark:#d9b37a; --ok:#8fc2a0; --ok-soft:#21352a; --bad:#e3907c; --bad-soft:#3b2620; --warn:#d9a868; --warn-soft:#3a2f20;
  --hero:#2c4537; --hero-fg:#ece8e1; --hero-mute:#a9c2b2; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--bg);color:var(--fg)}
body{font:16px/1.5 var(--f-body);margin:0;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body.nav{padding-bottom:calc(var(--nav) + 40px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));padding-block:8px 40px;display:flex;flex-direction:column;gap:22px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
header .in{max-width:720px;margin:0 auto;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));padding-block:12px;display:flex;align-items:center;gap:10px;min-height:60px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.1;letter-spacing:-.015em;font-optical-sizing:auto}
h1{font-size:1.25rem}
h2{font-size:2rem}
h3{font-size:1.3rem}
.hello{font-size:2.3rem;line-height:1.08;font-weight:350}
.hello em{color:var(--ink)}
.brand{border:0;background:transparent;padding:4px 6px 4px 0;display:flex;gap:10px;align-items:center;color:inherit;border-radius:12px;font-weight:400}
.brand:hover{border-color:transparent}
.logo{display:flex;gap:2px;align-items:flex-end}
.logo i{display:block;width:3px;background:var(--ink);border-radius:2px}
.status{margin-left:auto;font-size:.75rem;color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.lbl{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sec{display:flex;align-items:baseline;gap:8px}
.sec h3{flex:1}
button,.btn{font:inherit;font-weight:600;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none;line-height:1.3;transition:border-color .15s,background .15s}
button:hover,.btn:hover{border-color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
button.primary,.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
button.ghost{border-color:transparent;background:transparent;padding:6px 10px}
button.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
button.okb{background:var(--ok);border-color:var(--ok);color:var(--on-ink)}
button:disabled{opacity:.4;cursor:not-allowed}
button.icon{padding:6px;min-width:40px;min-height:40px;border-color:transparent;background:transparent;font-size:1.05rem;border-radius:50%}
button.circle{width:42px;height:42px;padding:0;border-radius:50%;background:var(--surface)}
input,textarea,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;width:100%;min-width:0}
textarea{resize:vertical;min-height:44px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.banner{background:var(--sunk);border-radius:18px;padding:14px 18px;font-size:.92rem}
.banner.err{background:var(--bad-soft)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;gap:14px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:32px 22px;text-align:center;display:grid;gap:14px;justify-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--ink-soft);color:var(--ink);white-space:nowrap;letter-spacing:.02em}
.chip.y{background:var(--warn-soft);color:var(--warn)}
.chip.g{background:var(--ok-soft);color:var(--ok)}
.search{position:relative}
.search input{padding-left:42px;border-radius:999px;background:var(--surface)}
.search::before{content:"";position:absolute;left:16px;top:50%;width:12px;height:12px;border:1.8px solid var(--muted);border-radius:50%;transform:translateY(-60%)}
.search::after{content:"";position:absolute;left:27px;top:59%;width:6px;height:1.8px;background:var(--muted);transform:rotate(45deg)}
/* Navigation unten: schwebend */
nav.bar{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:8;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.bar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;height:var(--nav);background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:28px;box-shadow:0 18px 40px -24px rgb(20 30 25 / .35)}
nav.bar button{border:0;background:transparent;flex-direction:column;gap:3px;font-size:.66rem;font-weight:600;color:var(--muted);border-radius:20px;padding:6px 0;letter-spacing:.03em}
nav.bar button[aria-current="page"]{color:var(--ink)}
nav.bar button[aria-current="page"]::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--ink)}
nav.bar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bar .plus{font-size:0}
nav.bar .plus svg{background:var(--fg);stroke:var(--bg);border-radius:50%;width:46px;height:46px;padding:13px}
/* Startseite */
.daily{display:flex;align-items:center;gap:18px}
.daily svg{flex:none}
.cont{background:var(--hero);color:var(--hero-fg);border-radius:28px;padding:24px;display:grid;gap:14px}
.cont .lbl{color:var(--hero-mute)}
.cont h3{font-size:1.8rem}
.cont .muted{color:var(--hero-mute)}
.cont .bar3{background:color-mix(in srgb,var(--hero-fg) 18%,transparent);height:4px}
.cont .bar3 .m{background:var(--mark)}.cont .bar3 .l{background:color-mix(in srgb,var(--mark) 45%,transparent)}
.cont button.primary{background:var(--hero-fg);color:var(--hero);border-color:var(--hero-fg)}
.cont button:not(.primary){background:transparent;color:var(--hero-fg);border-color:color-mix(in srgb,var(--hero-fg) 35%,transparent)}
/* Listen von Sets */
.sets{display:grid;gap:10px}
.set{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:8px;cursor:pointer;text-align:left;font-weight:400;width:100%;justify-content:stretch;justify-items:stretch;align-content:start}
.set:hover{border-color:var(--ink)}
.set .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.set .top h3{flex:1;min-width:0;overflow-wrap:anywhere;font-size:1.3rem}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;margin-inline:-2px;padding-inline:2px}
.hscroll .set{min-width:220px;max-width:260px;scroll-snap-align:start}
.bar3{display:flex;height:4px;border-radius:4px;overflow:hidden;background:var(--line);gap:2px}
.bar3 span{display:block;height:100%;border-radius:4px}
.bar3 .m{background:var(--ink)}.bar3 .l{background:var(--mark)}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.folder{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;text-align:left;font-weight:400;display:grid;gap:2px;cursor:pointer;justify-content:stretch;justify-items:start}
.folder strong{font-family:var(--f-display);font-weight:400;font-size:1.2rem;overflow-wrap:anywhere}
.folder::before{content:"";display:block;width:26px;height:18px;border:1.6px solid var(--ink);border-radius:3px 3px 5px 5px;margin-bottom:8px;background:linear-gradient(var(--ink) 0 0) 0 -2px/12px 4px no-repeat}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;background:var(--sunk);border-radius:999px;width:max-content;max-width:100%}
.tabs button{border:0;border-radius:999px;background:transparent;padding:8px 16px;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0 / .08)}
/* Set-Seite */
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:18px;text-align:left;justify-content:space-between;padding:18px;font-weight:400;border-radius:22px;min-height:118px}
.mode svg{width:26px;height:26px;flex:none;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mode strong{font-family:var(--f-body);font-weight:700;font-size:1rem;display:block}
.mode span{font-size:.78rem;color:var(--muted)}
.mode.hero{background:var(--hero);border-color:var(--hero);color:var(--hero-fg)}
.mode.hero svg{stroke:var(--hero-fg)}.mode.hero span{color:var(--hero-mute)}
.mode.wide{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:flex-start;gap:16px;min-height:0;background:var(--sunk);border-color:transparent}
.sheet .mode{flex-direction:row;align-items:center;min-height:0;border-radius:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats button{display:grid;gap:0;justify-items:start;text-align:left;font-weight:400;padding:10px 14px;border-radius:16px;background:transparent;border-color:transparent}
.stats b{font-family:var(--f-body);font-weight:600;font-size:1.3rem;font-variant-numeric:tabular-nums;color:var(--fg)}
.stats .small{color:var(--muted);font-size:.78rem}
.stats button[aria-pressed=true]{border-color:var(--line);background:var(--surface)}
.stats .m b::before,.stats .l b::before,.stats .n b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle}
.stats .m b::before{background:var(--ink)}.stats .l b::before{background:var(--mark)}.stats .n b::before{background:var(--line)}
.terms{display:grid;background:transparent}
.term{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:14px;padding:14px 2px;border-top:1px solid var(--line);align-items:start}
.term:first-child{border-top:0}
.panel .term,.sheet .term{padding-inline:0}
.term .t{font-weight:600;overflow-wrap:anywhere}
.term .d{overflow-wrap:anywhere;display:flex;gap:10px;align-items:flex-start;color:var(--muted)}
.term .d img,.thumb{width:48px;height:48px;object-fit:cover;border-radius:12px;border:1px solid var(--line);flex:none}
.term .acts{display:flex;gap:0}
.star{color:var(--line)}
.star[aria-pressed=true]{color:var(--mark)}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:calc(100% + 6px);z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 40px -20px rgb(0 0 0 / .3);display:grid;min-width:230px;padding:6px}
.menu .pop button{border:0;justify-content:flex-start;font-weight:500;border-radius:12px}
.menu .pop button:hover{background:var(--sunk)}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);border-radius:18px;padding:12px 16px}
/* Bearbeiten */
.erow{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.erow:first-child{border-top:0}
.erow .no{font-size:.8rem;color:var(--muted);padding-top:12px;font-variant-numeric:tabular-nums}
.erow .side{display:flex;flex-direction:column;gap:4px;align-items:center}
.erow .imgbox{display:flex;gap:6px;align-items:center;grid-column:3}
/* Lernen allgemein */
.studyhead{display:flex;gap:12px;align-items:center}
.studyhead #quit{width:42px;height:42px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--surface)}
.progress{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--fg);transition:width .25s}
.segs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
.segs i{height:4px;border-radius:4px;background:var(--line)}
.segs i.on{background:var(--ink)}
.prompt{background:transparent;padding:14px 0 4px;display:grid;gap:10px}
.prompt .w{font-family:var(--f-display);font-size:clamp(2.1rem,9vw,2.8rem);font-weight:400;overflow-wrap:anywhere;line-height:1.1;letter-spacing:-.015em}
.prompt img{max-height:180px;width:auto;border-radius:14px;justify-self:start}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{justify-content:flex-start;text-align:left;font-weight:500;padding:16px 18px;min-height:58px;border-radius:18px;gap:14px}
.opt .k{font-size:.72rem;color:var(--muted);font-weight:700;background:var(--bg);border-radius:8px;width:26px;height:26px;display:grid;place-items:center;flex:none}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--fg)}
.opt.right .k{background:var(--ok);color:var(--on-ink)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--fg)}
.opt:disabled{opacity:1}.opt:disabled:not(.right):not(.wrong){color:var(--muted)}
.fb{border-radius:24px;padding:18px 20px;display:grid;gap:4px}
.fb strong{font-family:var(--f-display);font-weight:400;font-size:1.5rem;line-height:1.1}
.fb.ok{background:var(--hero);color:var(--hero-fg)}.fb.ok .small{color:var(--hero-mute)}
.fb.no{background:var(--bad-soft)}.fb.al{background:var(--warn-soft)}
/* Karteikarten */
.deck{position:relative;min-height:360px;user-select:none;-webkit-user-select:none}
.fcard,.fcard *{touch-action:none}
.swipe-tag{position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:3;pointer-events:none;font-weight:700;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;padding:6px 14px;border-radius:999px}
.swipe-tag.r{background:var(--ok);color:var(--on-ink)}.swipe-tag.l{background:var(--warn);color:var(--on-ink)}
.deck::before{content:"";position:absolute;inset:14px 14px -10px;background:var(--sunk);border-radius:30px}
.fcard{position:absolute;inset:0;perspective:1400px;cursor:pointer}
.fcard .inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.fcard.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:30px;display:grid;place-items:center;padding:56px 22px 28px;text-align:center;overflow:hidden;box-shadow:0 24px 44px -30px rgb(20 30 25 / .4)}
.face .w{font-family:var(--f-display);font-size:clamp(2.1rem,9.5vw,2.9rem);font-weight:400;overflow-wrap:anywhere;max-width:100%;display:grid;gap:12px;justify-items:center;line-height:1.12;letter-spacing:-.015em}
.face .w img{max-height:150px;width:auto;border-radius:14px}
.face .lbl{position:absolute;top:22px;left:24px}
.face .tools{position:absolute;top:12px;right:12px;display:flex;gap:4px}
.face .tools button{background:var(--bg)}
.face.back{transform:rotateY(180deg);background:var(--ink-soft)}
.swipe-l .face{border-color:var(--warn);box-shadow:inset 0 0 0 2px var(--warn)}
.swipe-r .face{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.counts{display:flex;justify-content:space-between;font-weight:600;font-variant-numeric:tabular-nums;font-size:.86rem}
.counts .l{color:var(--warn)}.counts .r{color:var(--ok)}
.fbtns{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fbtns .big{width:66px;height:66px;padding:0;border-radius:50%;font-size:0}
.fbtns .big svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fbtns #no{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,var(--line));color:var(--warn)}
.fbtns #yes{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.fbtns .icon{border:1px solid var(--line);background:var(--surface);width:46px;height:46px}
@media (prefers-reduced-motion:reduce){.fcard .inner,.progress span{transition:none}}
/* Zuordnen */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{min-height:96px;padding:10px;font-weight:500;font-size:.9rem;overflow-wrap:anywhere;hyphens:auto;line-height:1.25;border-radius:18px}
.tile.sel{border-color:var(--ink);background:var(--ink-soft)}
.tile.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
.tile.gone{visibility:hidden}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.tile.bad{animation:none}}
.timer{font-family:var(--f-display);font-size:1.8rem;font-variant-numeric:tabular-nums}
/* Test */
.q{display:grid;gap:12px}
.q .num{font-size:.75rem;color:var(--muted);letter-spacing:.06em}
.q .prompt{padding:0}
.q .prompt .w{font-size:1.7rem}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice[aria-pressed=true]{border-color:var(--ink);background:var(--ink-soft)}
.score{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ring{width:112px;height:112px}
.res{border-left:3px solid var(--ok)}.res.no{border-left-color:var(--bad)}
/* Import */
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;display:grid;gap:10px;justify-items:center}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:72px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.rev{display:grid;gap:8px}
.rev .r{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center}
.rev .r input[type=checkbox]{width:20px;height:20px}
.rev .flag{grid-column:2/-1;font-size:.78rem;color:var(--muted);margin-top:-2px}
.rev .flag.dup{color:var(--bad)}
/* Overlays */
.sheet{position:fixed;inset:0;z-index:30;background:rgb(20 27 24 / .38);display:flex;align-items:flex-end;justify-content:center}

.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:.88rem;z-index:40;max-width:calc(100% - 32px);display:flex;gap:10px;align-items:center}
.av{display:inline-grid;place-items:center;flex:none;border-radius:50%;background:var(--ink-soft) center/cover no-repeat;color:var(--ink);font-family:var(--f-body);font-weight:600;overflow:hidden;border:1px solid var(--line)}
.av.has{color:transparent}
button.me{padding:0;border:0;background:transparent;border-radius:50%}
.cheer{position:fixed;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;justify-content:center;align-items:flex-end;gap:4px;pointer-events:none}
.cheer svg{width:clamp(84px,24vw,120px);height:auto;animation:catpop 1.7s cubic-bezier(.3,1.4,.5,1) both;filter:drop-shadow(0 6px 10px rgb(0 0 0 / .18))}

@media (prefers-reduced-motion:reduce){.cheer svg{animation:catfade 1.6s both}.cheer .pl,.cheer .pr,.cheer .cf{animation:none}@keyframes catfade{0%,100%{opacity:0}15%,80%{opacity:1}}}

}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ===== KONFIGURATION =====
const SUPABASE_URL='https://xhbocgunjbrnyrzjsysx.supabase.co';
const SUPABASE_KEY='sb_publishable_hg0dmW8eAhQyHMt8Vuhufw_4MvX6dCQ';
const SCAN_FUNCTION='smart-service';
// =========================

const INTERVALS=[0,1,2,4,8,16]; // Tage bis zur nächsten Abfrage je Fach 1–5
const DAY=86400000;
const LANGS={'Englisch':'en-GB','Deutsch':'de-DE','Französisch':'fr-FR','Spanisch':'es-ES','Italienisch':'it-IT','Niederländisch':'nl-NL','Portugiesisch':'pt-PT','Polnisch':'pl-PL','Russisch':'ru-RU','Türkisch':'tr-TR','Schwedisch':'sv-SE','Latein':'it-IT','Japanisch':'ja-JP','Chinesisch':'zh-CN'};
const MODE_NAMES={flash:'Karteikarten',learn:'Lernen',test:'Test',match:'Zuordnen',srs:'Wiederholen'};
const ICONS={
  flash:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v10"/></svg>',
  learn:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/><path d="M3 12h2M19 12h2"/></svg>',
  test:'<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
  match:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1"/><rect x="14" y="13" width="7" height="7" rx="1"/><path d="M10 7.5h3a2 2 0 0 1 2 2V13"/></svg>',
  srs:'<svg viewBox="0 0 24 24"><path d="M4 19h16"/><rect x="5" y="13" width="2.5" height="6"/><rect x="9.5" y="10" width="2.5" height="9"/><rect x="14" y="7" width="2.5" height="12"/><path d="M18.5 4v15"/></svg>'};

const S={sb:null,uid:null,email:'',sets:{},prog:{},user:{folders:[],settings:{}},server:new Set(),view:{name:'home'},loaded:false,saving:false,needsUpdate:false,imgUrls:{}};
const P={sets:new Set(),cards:new Set(),delCards:new Set(),delSets:new Set(),prog:new Set(),user:false};
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const now=()=>Date.now();
const iso=()=>new Date().toISOString();
function toast(m,action){const t=$('#toast');t.innerHTML=`<span>${esc(m)}</span>${action?`<button class="ghost" style="color:inherit;text-decoration:underline">${esc(action.label)}</button>`:''}`;t.hidden=false;
  if(action)t.querySelector('button').onclick=()=>{action.fn();t.hidden=true};clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,action?5500:2800)}
function setStatus(m){$('#status').textContent=m}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

// ================= Persistenz =================
const cacheKey=()=>'kk2-'+S.uid;
function cacheWrite(){if(!S.uid)return;try{localStorage.setItem(cacheKey(),JSON.stringify({sets:S.sets,prog:S.prog,user:S.user,server:[...S.server],paused:S.paused||{},
  P:{sets:[...P.sets],cards:[...P.cards],delCards:[...P.delCards],delSets:[...P.delSets],prog:[...P.prog],user:P.user}}))}catch(e){}}
function cacheRead(){try{return JSON.parse(localStorage.getItem(cacheKey())||'null')}catch(e){return null}}
const pending=()=>P.sets.size+P.cards.size+P.delCards.size+P.delSets.size+P.prog.size+(P.user?1:0);
let saveTimer;
function schedule(){cacheWrite();setStatus('Ungespeichert…');clearTimeout(saveTimer);saveTimer=setTimeout(flush,600)}
const qSet=id=>{P.sets.add(id);S.sets[id].updated=now();schedule()};
const qCard=cid=>{P.cards.add(cid);P.delCards.delete(cid);schedule()};
const qDelCard=cid=>{P.cards.delete(cid);P.delCards.add(cid);schedule()};
const qProg=sid=>{P.prog.add(sid);schedule()};
const qUser=()=>{P.user=true;schedule()};
function findCard(cid){for(const s of Object.values(S.sets)){const c=s.cards.find(x=>x.id===cid);if(c)return{s,c}}return null}
const meta=s=>({name:s.name,from:s.from,to:s.to,created:s.created});
async function chunked(arr,n,fn){for(let i=0;i<arr.length;i+=n){const {error}=await fn(arr.slice(i,i+n));if(error)throw error}}
async function flush(){
  if(!S.sb||!S.uid||S.needsUpdate)return;
  if(S.saving){clearTimeout(saveTimer);saveTimer=setTimeout(flush,400);return}
  if(!pending()){setStatus('Gespeichert');return}
  S.saving=true;setStatus('Speichere…');
  const p={sets:[...P.sets],cards:[...P.cards],delCards:[...P.delCards],delSets:[...P.delSets],prog:[...P.prog],user:P.user};
  P.sets.clear();P.cards.clear();P.delCards.clear();P.delSets.clear();P.prog.clear();P.user=false;
  const sb=S.sb;
  try{
    const newSets=p.sets.filter(id=>S.sets[id]&&!S.server.has(id)),oldSets=p.sets.filter(id=>S.sets[id]&&S.server.has(id));
    if(newSets.length){await chunked(newSets.map(id=>({id,doc:meta(S.sets[id]),updated_at:iso()})),200,r=>sb.from('sets').upsert(r));newSets.forEach(id=>S.server.add(id))}
    const cards=p.cards.map(cid=>{const f=findCard(cid);return f&&{id:cid,set_id:f.s.id,t:f.c.t,d:f.c.d,img:f.c.img||null,pos:f.c.pos,updated_at:iso()}}).filter(Boolean);
    await chunked(cards,400,r=>sb.from('cards').upsert(r));
    await chunked(p.delCards,200,r=>sb.from('cards').delete().in('id',r));
    const prog=p.prog.filter(id=>S.sets[id]).map(id=>({user_id:S.uid,set_id:id,data:S.prog[id]||{},updated_at:iso()}));
    await chunked(prog,200,r=>sb.from('progress').upsert(r,{onConflict:'user_id,set_id'}));
    if(oldSets.length)await chunked(oldSets.map(id=>({id,doc:meta(S.sets[id]),updated_at:iso()})),200,r=>sb.from('sets').upsert(r));
    if(p.user){const {error}=await sb.from('user_data').upsert({user_id:S.uid,data:S.user,updated_at:iso()});if(error)throw error}
    if(p.delSets.length){await chunked(p.delSets,100,r=>sb.from('sets').delete().in('id',r));p.delSets.forEach(id=>S.server.delete(id))}
    setStatus(pending()?'Speichere…':'Gespeichert');
  }catch(e){
    if(e&&e.code==='42501'){p.sets.forEach(x=>P.sets.add(x));p.cards.forEach(x=>{if(!P.delCards.has(x))P.cards.add(x)});p.delCards.forEach(x=>{if(!P.cards.has(x))P.delCards.add(x)});p.delSets.forEach(x=>P.delSets.add(x));p.prog.forEach(x=>P.prog.add(x));if(p.user)P.user=true;
      S.saving=false;cacheWrite();setStatus('Nicht gespeichert');toast('Speichern vom Server abgelehnt. Deine Änderungen bleiben auf diesem Gerät und werden später erneut gesendet.');
      clearTimeout(saveTimer);saveTimer=setTimeout(flush,60000);return}
    if(e&&(e.status===401||/jwt|token|unauthori/i.test(e.message||''))){const r=await S.sb.auth.refreshSession().catch(x=>({error:x}));
      if(r.error){p.sets.forEach(x=>P.sets.add(x));p.cards.forEach(x=>P.cards.add(x));p.delCards.forEach(x=>P.delCards.add(x));p.delSets.forEach(x=>P.delSets.add(x));p.prog.forEach(x=>P.prog.add(x));if(p.user)P.user=true;
        S.saving=false;cacheWrite();S.uid=null;renderLogin('Deine Anmeldung ist abgelaufen. Bitte neu anmelden – deine Änderungen sind auf diesem Gerät gesichert.');return}}
    p.sets.forEach(x=>P.sets.add(x));p.cards.forEach(x=>{if(!P.delCards.has(x))P.cards.add(x)});p.delCards.forEach(x=>{if(!P.cards.has(x))P.delCards.add(x)});p.delSets.forEach(x=>P.delSets.add(x));p.prog.forEach(x=>P.prog.add(x));if(p.user)P.user=true;
    setStatus('Offline – wird nachgeholt');clearTimeout(saveTimer);saveTimer=setTimeout(flush,6000);
  }
  S.saving=false;cacheWrite();
  if(pending()&&!saveTimer)saveTimer=setTimeout(flush,400);
}
window.addEventListener('beforeunload',e=>{if(S.view&&STUDY.includes(S.view.name))parkStudy();cacheWrite();if(pending()||S.saving){e.preventDefault();e.returnValue=''}});
window.addEventListener('online',()=>flush());
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){if(S.view&&STUDY.includes(S.view.name))parkStudy();cacheWrite();flush()}
  else if(S.uid&&!pending()&&!S.saving&&['home','library','folder','set','profile'].includes(S.view.name))loadAll(true);
});

async function fetchCards(){const out=[];for(let i=0;;i+=1000){const {data,error}=await S.sb.from('cards').select('id,set_id,t,d,img,pos').order('set_id').order('pos').range(i,i+999);if(error)throw error;out.push(...data);if(data.length<1000)break}return out}
async function loadAll(quiet){
  try{
    const [a,cards,c,d]=await Promise.all([S.sb.from('sets').select('id,user_id,doc,updated_at'),fetchCards(),S.sb.from('progress').select('set_id,data'),S.sb.from('user_data').select('data').maybeSingle()]);
    for(const r of [a,c,d])if(r.error)throw r.error;
    // lokale, noch nicht gespeicherte Änderungen sichern
    const keepSets={},keepCards={},keepProg={};
    P.sets.forEach(id=>{if(S.sets[id])keepSets[id]=S.sets[id]});
    P.cards.forEach(cid=>{const f=findCard(cid);if(f)keepCards[cid]={sid:f.s.id,c:f.c}});
    P.prog.forEach(id=>{if(S.prog[id])keepProg[id]=S.prog[id]});
    const sets={},migrate=[];
    S.server=new Set();
    a.data.forEach(r=>{const doc=r.doc||{};S.server.add(r.id);
      sets[r.id]={id:r.id,owner:r.user_id,name:doc.name||'Ohne Titel',from:doc.from||'Englisch',to:doc.to||'Deutsch',created:doc.created||Date.parse(r.updated_at),updated:Date.parse(r.updated_at),cards:[]};
      if(Array.isArray(doc.cards))migrate.push({id:r.id,cards:doc.cards})});
    cards.forEach(c=>{const s=sets[c.set_id];if(s)s.cards.push({id:c.id,t:c.t,d:c.d,img:c.img,pos:c.pos})});
    const prog={};c.data.forEach(r=>prog[r.set_id]=r.data||{});
    Object.values(keepSets).forEach(s=>{const cur=sets[s.id];sets[s.id]={...s,cards:cur?cur.cards:s.cards}});
    Object.entries(keepCards).forEach(([cid,{sid,c}])=>{const s=sets[sid];if(!s)return;const i=s.cards.findIndex(x=>x.id===cid);if(i>=0)s.cards[i]=c;else s.cards.push(c)});
    P.delCards.forEach(cid=>Object.values(sets).forEach(s=>s.cards=s.cards.filter(x=>x.id!==cid)));
    P.delSets.forEach(id=>delete sets[id]);
    Object.assign(prog,keepProg);
    Object.values(sets).forEach(s=>s.cards.sort((x,y)=>x.pos-y.pos));
    S.sets=sets;S.prog=prog;
    if(!P.user)S.user=Object.assign({folders:[],settings:{}},d.data?.data||{});
    S.needsUpdate=false;
    // Altdaten (Version 1: Karten im Set gespeichert) ins neue Format übernehmen
    migrate.forEach(({id,cards})=>{const s=S.sets[id];if(!s||s.owner!==S.uid)return;
      if(!s.cards.length){const pr=S.prog[id]||{c:{}};pr.c=pr.c||{};
        cards.forEach((c,i)=>{if(!c||!c.t)return;const cid=c.id||uid();s.cards.push({id:cid,t:c.t,d:c.d,img:null,pos:i});
          pr.c[cid]={box:c.box||1,due:c.due||0,ok:c.ok||0,no:c.no||0,lv:0,seen:!!(c.ok||c.no)};P.cards.add(cid)});
        S.prog[id]=pr;P.prog.add(id)}
      P.sets.add(id)});
    // exakt doppelte Begriffe (gleicher Begriff und gleiche Definition) automatisch bereinigen
    const cleaned=[];Object.values(S.sets).forEach(st=>{const d=findDups(st);if(!d.length)return;const ids=new Set(d.map(c=>c.id));
      st.cards=st.cards.filter(c=>!ids.has(c.id));ids.forEach(id=>{P.cards.delete(id);P.delCards.add(id)});P.sets.add(st.id);cleaned.push(`${d.length} in „${st.name}“`)});
    if(migrate.length||cleaned.length)toast([migrate.length?'Lernsets ins neue Format übernommen.':'',cleaned.length?'Doppelte Begriffe entfernt: '+cleaned.join(', ')+'.':''].filter(Boolean).join(' '));
    S.loaded=true;cacheWrite();
    setStatus(pending()?'Ungespeichert…':'Gespeichert');
    if(pending())flush();
    if(!quiet||['home','library','folder','set','profile'].includes(S.view.name))render();
  }catch(e){
    if(['PGRST205','42P01','PGRST200'].includes(e.code)||/cards|progress|user_data/.test(e.message||'')&&/(not find|does not exist|schema cache)/i.test(e.message||'')){S.needsUpdate=true;S.loaded=true;render();return}
    setStatus('Offline');if(!quiet)toast('Server nicht erreichbar. Du arbeitest mit der Kopie auf diesem Gerät.');S.loaded=true;render();
  }
}

// ================= Datenhelfer =================
const ckey=(t,d)=>(String(t)+'\u0000'+String(d)).toLowerCase().replace(/\s+/g,' ').trim();
const tkey=t=>String(t).toLowerCase().replace(/\s+/g,' ').trim();
const progOf=sid=>{const p=S.prog[sid]||(S.prog[sid]={c:{}});p.c=p.c||{};return p};
const cp=(sid,cid)=>{const p=progOf(sid);return p.c[cid]||(p.c[cid]={box:1,due:0,ok:0,no:0,lv:0,seen:false})};
function status(sid,cid){const c=progOf(sid).c[cid];if(!c)return'n';if(c.lv>=2)return'm';return c.seen?'l':'n'}
function counts(s){const r={n:0,l:0,m:0};s.cards.forEach(c=>r[status(s.id,c.id)]++);return r}
const dueCards=s=>{const t=now();return s.cards.filter(c=>(cp(s.id,c.id).due||0)<=t)};
const isStar=(sid,cid)=>!!progOf(sid).c[cid]?.star;
function newSet(name){const id=uid();S.sets[id]={id,owner:S.uid,name,from:'Englisch',to:'Deutsch',created:now(),updated:now(),cards:[]};qSet(id);return id}
function addCards(sid,pairs){const s=S.sets[sid];const have=new Set(s.cards.map(c=>ckey(c.t,c.d)));let added=0,skipped=0,pos=s.cards.reduce((m,c)=>Math.max(m,c.pos),-1);
  pairs.forEach(p=>{const t=String(p.term||'').trim(),d=String(p.definition||'').trim();if(!t||!d)return;const k=ckey(t,d);if(have.has(k)){skipped++;return}have.add(k);
    const c={id:uid(),t,d,img:null,pos:++pos};s.cards.push(c);qCard(c.id);added++});
  if(added)qSet(sid);return{added,skipped}}
const addMsg=r=>r.added+' Begriffe hinzugefügt'+(r.skipped?`, ${r.skipped} doppelte übersprungen`:'');
function findDups(s){const seen=new Map(),dup=[];s.cards.forEach(c=>{const k=ckey(c.t,c.d),o=seen.get(k);if(!o){seen.set(k,c);return}
  if(cp(s.id,c.id).box>cp(s.id,o.id).box){dup.push(o);seen.set(k,c)}else dup.push(c)});return dup}
const dayKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const goalOf=()=>S.user.settings?.goal||20;
const todayCount=()=>S.user.daily?.d===dayKey()?S.user.daily.n:0;
function bumpDaily(delta){const k=dayKey(),before=todayCount();S.user.daily={d:k,n:Math.max(0,before+delta)};qUser();
  if(delta>0&&before<goalOf()&&S.user.daily.n>=goalOf()){setTimeout(()=>{cheer(3);toast('Tagesziel erreicht – stark!')},350)}}
function ringSvg(frac,size=64,stroke=6){const r=(size-stroke)/2,C=2*Math.PI*r,f=Math.max(0,Math.min(1,frac));

const LCODE={'Englisch':'en','Deutsch':'de','Französisch':'fr','Spanisch':'es','Italienisch':'it','Niederländisch':'nl','Portugiesisch':'pt','Polnisch':'pl','Russisch':'ru','Türkisch':'tr','Schwedisch':'sv','Latein':'la','Japanisch':'ja','Chinesisch':'zh'};
// Spracherkennung Deutsch/Englisch (Heuristik)
const DE_W=new Set('der die das den dem des ein eine einen einem einer und oder nicht zu zum zur mit von für auf aus bei nach über unter sich etw etwas jdn jdm jmd jemand jemanden jemandem hier etwa auch ist sind wird werden durch gegen ohne um am im vom ins beim als wie dass'.split(' '));
const EN_W=new Set('the a an and or not to of for on in at by with from somebody something someone sb sth is are be been into out up off over under as that this which who'.split(' '));
const DE_SUF=/(ung|ungen|keit|heit|schaft|lich|isch|ieren|iert|chen|nis|tät|igkeit|enden?|bar)$/;
const EN_SUF=/(tion|tions|sion|ness|ment|ments|ity|ous|ive|ful|less|ence|ance|ing|ed|ship|able|ible|ize|ise|ly|ary|ory|ure)$/;
function langScore(text){
  const t=String(text).replace(/\([^)]*\)/g,' ').replace(/^(hier etwa|hier|etwa)\s*:/i,' ');
  let de=0,en=0;
  if(/[äöüß]/i.test(t))de+=3;
  const words=t.toLowerCase().match(/[a-zäöüß]+/g)||[];
  for(const w of words){
    if(DE_W.has(w))de+=2;if(EN_W.has(w))en+=2;
    if(w.length>4&&DE_SUF.test(w))de+=1;if(w.length>4&&EN_SUF.test(w))en+=1;
    if(/sch|tz|ck|pf|ei|ie|au|eu/.test(w))de+=.5; if(/th|wh|ph|ght|ea|oo|ou|w/.test(w))en+=.5;
  }
  // deutsche Substantive: Großschreibung mitten im Text
  (t.match(/(^|[\s,(\/-])[A-ZÄÖÜ][a-zäöüß]{3,}/g)||[]).forEach(()=>de+=2);
  for(const w of words){if(w.length>4&&/en$/.test(w)&&!/(ten|ken|zen|men|ven|wen|een|oen)$/.test(w))de+=1.2}
  return{de,en}}
function detect(text){const {de,en}=langScore(text);if(de-en>=2)return'de';if(en-de>=2)return'en';return null}
// Liefert Hinweise je Paar. hard=true: Zeile wird abgewählt und muss bewusst bestätigt werden.
function pairIssues(t,d,s,model){
  const out=[],fc=LCODE[s.from],tc=LCODE[s.to],T=String(t||'').trim(),D=String(d||'').trim();
  if(!T||!D){out.push({hard:true,msg:'Begriff oder Definition fehlt'});return out}
  const flat=x=>x.toLowerCase().replace(/\s+/g,' ').trim();if(flat(T)===flat(D))out.push({hard:true,msg:'Begriff und Definition sind gleich'});
  if(/^[\d\s.,\/-]+$/.test(T)||/^[\d\s.,\/-]+$/.test(D))out.push({hard:true,msg:'Sieht aus wie eine Zahl oder Seitenzahl'});
  if(T.length>90)out.push({hard:false,msg:'Begriff ungewöhnlich lang – evtl. zwei Zeilen zusammengezogen'});
  // Sprache: Angabe der KI (falls vorhanden), sonst eigene Erkennung (nur Deutsch/Englisch)
  const heur=fc!==tc&&['de','en'].includes(fc)&&['de','en'].includes(tc);
  const tl=(model&&model.term_lang)||(heur?detect(T):null),dl=(model&&model.def_lang)||(heur?detect(D):null);
  const tWrong=tl&&fc&&tl!==fc&&tl===tc,dWrong=dl&&tc&&dl!==tc&&dl===fc;
  if(tWrong&&(dWrong||dl!==tc))out.push({hard:true,swap:true,msg:`Spalten vertauscht: Begriff wirkt ${s.to}`});
  else if(tWrong)out.push({hard:true,msg:`Begriff wirkt ${s.to} statt ${s.from}`});
  else if(dWrong)out.push({hard:true,msg:`Definition wirkt ${s.from} statt ${s.to}`});
  if(model&&model.unsicher)out.push({hard:false,msg:'Erkennung unsicher'+(model.hinweis?': '+model.hinweis:'')});
  return out}
// Automatischer Import: tauscht vertauschte Spalten, verwirft Doppelte/Leeres/Zahlen, übernimmt Sauberes sofort.
// Nur echte Zweifelsfälle (z. B. Deutsch auf beiden Seiten) kommen zurück.
function autoImport(s,pairs){
  const res={added:0,swapped:0,skipped:0,dropped:0,doubts:[]};const ok=[];
  const have=new Set(s.cards.map(c=>ckey(c.t,c.d)));
  for(const p of pairs){let t=String(p.term||'').trim(),d=String(p.definition||'').trim(),model=p;
    let iss=pairIssues(t,d,s,model);
    if(iss.some(i=>i.swap)){[t,d]=[d,t];model=p.term_lang?{term_lang:p.def_lang,def_lang:p.term_lang}:null;iss=pairIssues(t,d,s,model);res.swapped++}
    if(!t||!d||iss.some(i=>/Seitenzahl|fehlt/.test(i.msg))){res.dropped++;continue}
    const k=ckey(t,d);if(have.has(k)){res.skipped++;continue}
    if(iss.some(i=>i.hard)){res.doubts.push({term:t,definition:d,msg:iss.filter(i=>i.hard).map(i=>i.msg).join(' · ')});continue}
    have.add(k);ok.push({term:t,definition:d})}
  res.added=addCards(s.id,ok).added;return res}

function norm(s){return String(s).toLowerCase().replace(/\([^)]*\)|\[[^\]]*\]/g,' ').replace(/[.!?¡¿"„“”'’:]/g,'').replace(/\s+/g,' ').trim()}
const ART=/^(to|the|a|an|der|die|das|den|dem|des|ein|eine|einen|einem|sich|jmd|jdn|jdm|etw)\s+/;
function core(s){let x=norm(s),p;do{p=x;x=x.replace(ART,'')}while(x!==p);return x}
function variants(ans){
  const out=new Set([ans]);
  String(ans).split(/[,;]/).map(x=>x.trim()).filter(Boolean).forEach(p=>{
    const c=p.replace(/^(hier etwa|hier|etwa|z\.\s?b\.|jurist\.\s*auch|auch)\s*:\s*/i,'').trim();out.add(p);out.add(c);
    const m=c.match(/^(.*?)\(([^)]{1,3})\)(.*)$/);if(m){out.add(m[1]+m[3]);out.add(m[1]+m[2]+m[3])}
    if(c.includes('/')){const seg=c.split('/').map(x=>x.trim());
      if(seg.length===2&&seg[1].length<=3&&!/\s/.test(seg[1])){out.add(seg[0]);out.add(seg[0]+seg[1])}
      else seg.forEach(x=>x&&!x.endsWith('-')&&out.add(x))}
  });
  return[...out].filter(Boolean)}
function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]}
function check(input,ans){
  const inp=norm(input);if(!inp)return{res:'no'};
  const vs=variants(ans);
  if(vs.some(a=>norm(a)===inp))return{res:'ok'};
  const ci=core(input);
  if(ci&&vs.some(a=>core(a)===ci))return{res:'almost',msg:'Richtig. Achte auf den vollständigen Eintrag (Artikel bzw. „to“).'};
  if(vs.some(a=>{const c=core(a);return c.length>4&&lev(c,ci)<=(c.length>10?2:1)}))return{res:'typo'};
  return{res:'no'}}

function vEdit(){
  const s=S.sets[S.view.sid];const langs=Object.keys(LANGS);
  const opt=cur=>langs.map(l=>`<option ${l===cur?'selected':''}>${l}</option>`).join('');
  app.innerHTML=`<div class="row"><button class="ghost" id="back">← Fertig</button><span class="grow"></span><button class="primary" id="done">Fertig</button></div>
  <div class="panel"><label class="lbl" for="en">Titel</label><input id="en" value="${esc(s.name)}" maxlength="80">
    <div class="row"><div class="grow"><label class="lbl" for="ef">Begriff</label><select id="ef">${opt(s.from)}</select></div><div class="grow"><label class="lbl" for="et">Definition</label><select id="et">${opt(s.to)}</select></div></div></div>

  <div class="panel"><span class="lbl">Neuer Begriff</span><div class="row"><input id="nt" class="grow" placeholder="${esc(s.from)}" aria-label="Begriff"><input id="nd" class="grow" placeholder="${esc(s.to)}" aria-label="Definition"><button class="primary" id="add">+ Hinzufügen</button></div><span class="small muted">Enter springt ins nächste Feld und fügt dann hinzu.</span></div>`;
  const back=()=>{flush();go({name:'set',sid:s.id})};$('#back').onclick=back;$('#done').onclick=back;
  $('#en').oninput=e=>{const v=e.target.value.trim();if(v){s.name=v;qSet(s.id)}};
  $('#ef').onchange=e=>{s.from=e.target.value;qSet(s.id)};$('#et').onchange=e=>{s.to=e.target.value;qSet(s.id)};
  $('#photo').onclick=()=>go({name:'import',sid:s.id,files:[],rows:null,back:'edit'});
  $('#paste').onclick=()=>{$('#pf').hidden=false;$('#pt').focus()};
  $('#ptok').onclick=()=>{const pairs=$('#pt').value.split('\n').map(l=>{const m=l.split(/\t|;| - | – /);return m.length>=2?{term:m[0],definition:m.slice(1).join(', ')}:null}).filter(Boolean);
    if(!pairs.length){toast('Keine Zeile erkannt. Trenne Begriff und Definition mit Tab oder Semikolon.');return}const r=autoImport(s,pairs);if(!r.doubts.length){toast(`${r.added} übernommen`+(r.swapped?`, ${r.swapped} getauscht`:'')+(r.skipped?`, ${r.skipped} doppelte übersprungen`:''));$('#pt').value='';$('#pf').hidden=true;drawRows()}else go({name:'import',sid:s.id,files:[],rows:true,result:r,back:'edit'})};
  const add=()=>{const t=$('#nt').value.trim(),d=$('#nd').value.trim();if(!t||!d){(t?$('#nd'):$('#nt')).focus();return}
    const iss=pairIssues(t,d,s,null);const r=addCards(s.id,[{term:t,definition:d}]);if(r.skipped)toast('Diesen Begriff gibt es mit dieser Definition schon.');
    else if(iss.length){const c=s.cards[s.cards.length-1];toast('Bitte prüfen: '+iss[0].msg,{label:'Rückgängig',fn:()=>{s.cards=s.cards.filter(x=>x!==c);qDelCard(c.id);qSet(s.id);drawRows()}})}$('#nt').value='';$('#nd').value='';drawRows();$('#nt').focus()};
  $('#add').onclick=add;$('#nt').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#nd').focus()}};$('#nd').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}};

function vImport(){
  const v=S.view,s=S.sets[v.sid];
  const back=()=>go(v.back==='edit'?{name:'edit',sid:s.id}:{name:'set',sid:s.id});
  app.innerHTML=`<div class="row"><button class="ghost" id="back">← ${esc(s.name)}</button></div><h2>Seite fotografieren</h2>
  ${v.rows?'':`<div class="drop"><p style="margin:0"><strong>Fotografiere die Vokabelliste</strong> oder wähle Fotos bzw. Screenshots aus. Mehrere Seiten auf einmal gehen auch.</p>
    <p class="small muted" style="margin:0">Tipp: gerade von oben, gutes Licht, beide Spalten vollständig im Bild, keine Zeilen der nächsten Seite. Doppelte werden trotzdem erkannt.</p>
    <label class="btn primary" for="pics">Fotos wählen</label><input type="file" id="pics" accept="image/*" multiple hidden><div class="thumbs" id="thumbs"></div></div>
  <div class="row"><button class="primary" id="scan" ${v.files.length?'':'disabled'}>Begriffe erkennen</button><span class="small muted" id="scanst"></span></div>`}
  <div id="review"></div>`;
  $('#back').onclick=back;
  if(v.rows)return drawReview();
  const th=$('#thumbs');v.files.forEach(f=>{const i=new Image();i.src=URL.createObjectURL(f);i.alt='Foto';th.append(i)});
  $('#pics').onchange=e=>{v.files=[...v.files,...e.target.files];render()};
  $('#scan').onclick=async()=>{const btn=$('#scan'),st=$('#scanst');btn.disabled=true;const rows=[];
    for(let i=0;i<v.files.length;i++){st.textContent=`Lese Foto ${i+1} von ${v.files.length}…`;
      try{const img=await shrink(v.files[i],2000,3.5e6);
        const image=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(img)});
        const {data:res,error}=await S.sb.functions.invoke(SCAN_FUNCTION,{body:{image,mediaType:'image/jpeg',from:s.from,to:s.to}});
        if(error){let m=error.message;try{m=(await error.context.json()).error||m}catch(_){}throw{message:m}}
        (res?.pairs||[]).forEach(p=>p&&(p.term||p.definition)&&rows.push(p));
      }catch(e){toast(`Foto ${i+1}: ${e.message||'Erkennung fehlgeschlagen'}`)}}
    if(!rows.length){st.textContent='Keine Begriffe erkannt. Versuche ein schärferes Foto.';btn.disabled=false;return}
    v.result=autoImport(s,rows);v.rows=true;render()};
  function drawReview(){const r=v.result,ds=r.doubts;
    const parts=[];if(r.swapped)parts.push(`${r.swapped} vertauschte Spalten automatisch korrigiert`);if(r.skipped)parts.push(`${r.skipped} Doppelte übersprungen`);if(r.dropped)parts.push(`${r.dropped} leere Zeilen/Seitenzahlen verworfen`);
    $('#review').innerHTML=`<div class="panel"><h3>✓ ${r.added} Begriffe übernommen</h3>${parts.length?`<span class="small muted">${esc(parts.join(' · '))}</span>`:''}
    ${ds.length?`<div class="banner"><strong>Bei ${ds.length} ${ds.length===1?'Zeile':'Zeilen'} bin ich unsicher.</strong> Kurz entscheiden – alles andere ist schon drin.</div>
      <div class="rev">${ds.map((x,i)=>`<div class="panel" style="padding:10px;gap:6px" id="dz${i}"><span class="small" style="color:var(--bad)">⚠ ${esc(x.msg)}</span>
        <div class="two" style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input id="dt${i}" value="${esc(x.term)}" aria-label="${esc(s.from)}"><input id="dd${i}" value="${esc(x.definition)}" aria-label="${esc(s.to)}"></div>
        <div class="row"><button class="primary" data-ok="${i}">Übernehmen</button><button data-sw="${i}">Tauschen</button><button class="ghost" data-no="${i}">Verwerfen</button></div></div>`).join('')}</div>`:''}
    <div class="row"><button class="primary" id="fin">${ds.length?'Fertig (Rest verwerfen)':'Fertig'}</button><button class="ghost" id="more">Weitere Fotos</button></div></div>`;
    const done=i=>{ds.splice(i,1);drawReview()};

// ================= Lernmodi: Start =================
function startMode(sid,mode,opts={}){
  const s=S.sets[sid];if(!s||!s.cards.length)return;
  const pz=!opts.fresh&&!opts.ids&&pausedFor(sid,mode);
  if(pz){const v=unsnap(pz.v);if(v.name==='test'&&v.t0&&v.pausedAt)v.t0+=now()-v.pausedAt;delete v.pausedAt;return go(v)}
  if(opts.fresh&&S.paused)delete S.paused[sid+':'+mode];
  const base={sid,dir:opts.dir||S.user.settings?.dir||'fwd',star:!!opts.star,ids:opts.ids||null};
  if(mode==='flash')return go({name:'flash',...base,shuffle:!!opts.shuffle,track:opts.track!==false,srs:false,phase:'run'});
  if(mode==='srs')return go({name:'flash',...base,srs:true,track:true,shuffle:true,phase:'run'});
  if(mode==='learn')return go({name:'learn',...base,mc:true,write:true,phase:'setup'});
  if(mode==='test')return go({name:'test',...base,phase:'setup'});
  if(mode==='match')return go({name:'match',...base,phase:'intro'});
}

// ================= Lernen (adaptiv) =================
function vLearn(){
  const v=S.view,s=S.sets[v.sid];
  if(v.phase==='setup'){
    app.innerHTML=`${studyHead('Lernen',s)}<h2>Lernen einrichten</h2>

    ${optionsHtml(v,s,`<span class="lbl" style="margin-top:6px">Fragetypen</span><div class="checks"><label><input type="checkbox" id="omc" ${v.mc?'checked':''}>Multiple Choice</label><label><input type="checkbox" id="owr" ${v.write?'checked':''}>Schreiben</label></div>`)}
    <button class="primary" id="go" style="justify-self:start">Lernen starten</button>`;

    $('#owr').onchange=e=>{v.write=e.target.checked;if(!v.mc&&!v.write){v.mc=true;$('#omc').checked=true}};

    $('#go').onclick=()=>{v.phase='round';v.round=0;nextRound(v,s);touchStudy(s.id,'learn');render()};return}
  const pool=deckCards(s,v);
  const lvOf=id=>cp(s.id,id).lv||0;
  if(v.phase==='summary'||v.phase==='done'){
    const m=pool.filter(c=>lvOf(c.id)>=2).length,l=pool.filter(c=>lvOf(c.id)===1||(lvOf(c.id)===0&&cp(s.id,c.id).seen)).length,nn=pool.length-m-l;

    app.innerHTML=`${studyHead('Lernen',s)}<h2>${done?'Alles beherrscht!':'Runde '+v.round+' geschafft'}</h2>
    <div class="bar3" style="height:10px"><span class="m" style="width:${m/pool.length*100}%"></span><span class="l" style="width:${l/pool.length*100}%"></span></div>
    <div class="stats"><div class="panel"><span class="lbl">Beherrscht</span><b style="font-family:var(--f-display);font-size:1.6rem;color:var(--ok)">${m}</b></div><div class="panel"><span class="lbl">Lernst du gerade</span><b style="font-family:var(--f-display);font-size:1.6rem;color:var(--warn)">${l}</b></div><div class="panel"><span class="lbl">Noch nicht gelernt</span><b style="font-family:var(--f-display);font-size:1.6rem">${nn}</b></div></div>
    ${v.roundCards?`<div class="terms">${v.roundCards.map(id=>{const c=s.cards.find(x=>x.id===id);return c?`<div class="term"><span class="t">${esc(c.t)}</span><span class="d">${esc(c.d)}</span><span class="chip ${lvOf(id)>=2?'g':'y'}">${lvOf(id)>=2?'beherrscht':'lernst du'}</span></div>`:''}).join('')}</div>`:''}
    <div class="row">${done?`<button class="primary" id="restart">Nochmal von vorn</button><button id="totest">Test machen</button>`:`<button class="primary" id="cont">Weiter zu Runde ${v.round+1}</button>`}<button class="ghost" id="fin">Fertig</button></div>`;
    bindQuit(s.id);
    $('#cont')&&($('#cont').onclick=()=>{nextRound(v,s);render()});
    $('#restart')&&($('#restart').onclick=()=>{pool.forEach(c=>cp(s.id,c.id).lv=0);qProg(s.id);v.round=0;nextRound(v,s);render()});

    document.onkeydown=e=>{if(e.key==='Enter'&&$('#cont'))$('#cont').click()};return}
  // Frage

  const lv=lvOf(c.id),type=(lv===0&&v.mc)||!v.write?'mc':'write';const sd=side(s,c,q.rev);

      return`<button class="opt ${cls}" data-i="${i}" ${st.done?'disabled':''}><span class="k">${i+1}</span><span>${esc(o)}</span></button>`}).join('')}</div>`;

    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
    document.onkeydown=e=>{if(S.view!==v)return;const n=+e.key;if(!st.done&&n>=1&&n<=st.opts.length)pick(n-1);else if(st.done&&(e.key==='Enter'||e.key===' ')){e.preventDefault();$('#next')?.click()}};

      <input id="win" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(st.input||'')}" ${st.done?'disabled':''}>
      ${st.done?'':'<div class="row"><button class="primary">Antworten</button><button type="button" class="ghost" id="dunno">Weiß ich nicht</button></div>'}</form>`;
    if(!st.done){$('#win').focus();$('#wf').onsubmit=e=>{e.preventDefault();st.input=$('#win').value;if(!st.input.trim()){$('#win').focus();return}const r=check(st.input,sd.ans);st.r=r;st.right=r.res==='ok'||r.res==='almost';st.done=true;render()};
      $('#dunno').onclick=()=>{st.input='';st.r={res:'no'};st.right=false;st.done=true;render()}}
    document.onkeydown=e=>{if(S.view!==v)return;if(st.done&&e.key==='Enter'){e.preventDefault();$('#next')?.click()}};
  }
  if(st.done){
    const r=st.r;const cls=st.right?(r&&r.res==='almost'?'al':'ok'):'no';
    $('#fb').innerHTML=`<div class="fb ${cls}"><strong>${st.right?['Richtig.','Genau.','Sehr gut.','Weiter so.'][Math.random()*4|0]:r&&r.res==='typo'?'Fast. Tippfehler?':'Noch nicht ganz.'}</strong>
      ${r&&r.msg?`<span class="small">${esc(r.msg)}</span>`:''}<span class="small">${esc(sd.ask)} – ${esc(sd.ans)}</span>${sd.ansImg&&!st.right?imgTag(sd.ansImg,'thumb'):''}</div>
      <div class="row" style="margin-top:8px"><button class="primary" id="next">Weiter</button>${!st.right&&type==='write'?'<button class="ghost" id="ovr">Ich hatte recht</button>':''}</div>`;
    hydrateImgs();if(st.right&&!st.cheered){st.cheered=true;cheer(1)}
    $('#next').focus();$('#next').onclick=()=>commit(st.right);$('#ovr')&&($('#ovr').onclick=()=>commit(true));
  }
  function commit(right){const cc=cp(s.id,c.id);
    if(!q.graded){q.graded=true;grade(s.id,c.id,right)}
    if(right){if(!q.retry)cc.lv=Math.min(2,(cc.lv||0)+1);v.doneIds.add(c.id)}
    else{cc.lv=0;cc.seen=true;v.queue.push({id:c.id,rev:q.rev,retry:true})}
    qProg(s.id);v.qi++;afterQ(v,s)}
}
function nextRound(v,s){v.round++;const pool=deckCards(s,v);const lvOf=id=>cp(s.id,id).lv||0;
  const open=shuffle(pool.filter(c=>lvOf(c.id)<2)).sort((a,b)=>lvOf(b.id)-lvOf(a.id));
  if(!open.length){v.phase='done';v.roundCards=null;return}
  const pick=open.slice(0,7).map(c=>c.id);v.roundCards=pick;v.doneIds=new Set();v.queue=shuffle(pick).map(id=>({id,rev:dirRev(v.dir)}));v.qi=0;v.phase='q'}
function afterQ(v,s){
  // Runde ist vorbei, wenn jede Karte einmal (falsche zweimal) dran war
  const lvOf=id=>cp(s.id,id).lv||0;
  if(v.qi>=v.queue.length){const left=deckCards(s,v).filter(c=>lvOf(c.id)<2).length;v.phase=left?'summary':'done';return render()}
  render()}

// ================= Test =================
function vTest(){
  const v=S.view,s=S.sets[v.sid];const pool=deckCards(s,v);
  if(v.qs){v.qs=v.qs.filter(q=>s.cards.some(c=>c.id===q.id));if(!v.qs.length&&v.phase!=='setup'){v.phase='setup';v.qs=null}}
  if(v.phase==='setup'){v.count=Math.min(v.count||20,pool.length||1);v.types=v.types||{tf:true,mc:true,write:true};
    app.innerHTML=`${studyHead('Test',s)}<h2>Test einrichten</h2>
    ${optionsHtml(v,s,`<label class="toggle" for="ocnt"><span>Anzahl Fragen (max. ${pool.length})</span><input type="number" id="ocnt" min="1" max="${pool.length}" value="${v.count}" style="width:90px"></label>
      <span class="lbl" style="margin-top:6px">Fragetypen</span><div class="checks"><label><input type="checkbox" data-ty="tf" ${v.types.tf?'checked':''}>Wahr oder falsch</label><label><input type="checkbox" data-ty="mc" ${v.types.mc?'checked':''}>Multiple Choice</label><label><input type="checkbox" data-ty="write" ${v.types.write?'checked':''}>Schreiben</label></div>`)}
    <button class="primary" id="go" style="justify-self:start">Test starten</button>`;
    bindQuit(s.id);bindOptions(v);
    $('#ocnt').oninput=e=>v.count=Math.max(1,Math.min(pool.length,+e.target.value||1));
    app.querySelectorAll('[data-ty]').forEach(b=>b.onchange=()=>{v.types[b.dataset.ty]=b.checked;if(!Object.values(v.types).some(Boolean)){v.types.write=true;render()}});
    $('#go').onclick=()=>{buildTest(v,s,pool);v.phase='run';v.t0=now();touchStudy(s.id,'test');render()};return}
  if(v.phase==='run'){
    const qs=v.qs;const answered=qs.filter(q=>q.a!=null&&q.a!=='').length;
    app.innerHTML=`${studyHead('Test',s,`<span class="small muted" id="tcount">${answered} / ${qs.length}</span>`)}
    <div class="progress"><span style="width:${answered/qs.length*100}%"></span></div>
    ${qs.map((q,i)=>{const c=s.cards.find(x=>x.id===q.id),sd=side(s,c,q.rev);
      const head=`<span class="num">${i+1} von ${qs.length} · ${{tf:'Wahr oder falsch',mc:'Multiple Choice',write:'Schreiben'}[q.type]}</span>`;
      let body='';
      if(q.type==='tf')body=`<div class="prompt"><span class="lbl">${esc(sd.askL)}</span>${imgTag(sd.askImg)}<span class="w">${esc(sd.ask)}</span><span class="lbl">${esc(sd.ansL)}</span><span>${esc(q.shown)}</span></div><div class="tf"><button class="choice" data-q="${i}" data-v="true" aria-pressed="${q.a===true}">Wahr</button><button class="choice" data-q="${i}" data-v="false" aria-pressed="${q.a===false}">Falsch</button></div>`;
      if(q.type==='mc')body=`<div class="prompt"><span class="lbl">${esc(sd.askL)}</span>${imgTag(sd.askImg)}<span class="w">${esc(sd.ask)}</span></div><div class="opts">${q.opts.map((o,j)=>`<button class="opt choice" data-q="${i}" data-j="${j}" aria-pressed="${q.a===j}"><span class="k">${j+1}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
      if(q.type==='write')body=`<div class="prompt"><span class="lbl">${esc(sd.askL)}</span>${imgTag(sd.askImg)}<span class="w">${esc(sd.ask)}</span></div><input data-w="${i}" value="${esc(q.a||'')}" placeholder="Antwort (${esc(sd.ansL)})" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Antwort Frage ${i+1}">`;
      return`<section class="q panel" id="q${i}">${head}${body}</section>`}).join('')}
    <div id="sub"></div><button class="primary" id="submit" style="justify-self:start">Test abschicken</button>`;
    bindQuit(s.id);
    app.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const q=qs[+b.dataset.q];q.a=b.dataset.v?b.dataset.v==='true':+b.dataset.j;
      b.parentElement.querySelectorAll('[data-q]').forEach(x=>x.setAttribute('aria-pressed',x===b));const n=qs.filter(q=>q.a!=null&&q.a!=='').length;$('#tcount').textContent=n+' / '+qs.length;app.querySelector('.progress span').style.width=n/qs.length*100+'%'});
    app.querySelectorAll('[data-w]').forEach(inp=>inp.oninput=()=>{qs[+inp.dataset.w].a=inp.value});
    $('#submit').onclick=()=>{const open=qs.filter(q=>q.a==null||q.a==='').length;
      if(open&&!v.warned){v.warned=true;$('#sub').innerHTML=`<div class="banner">${open} Fragen sind noch unbeantwortet. Nochmal tippen, um trotzdem abzuschicken.</div>`;return}
      gradeTest(v,s);v.phase='result';go(v)};return}
  // Ergebnis
  const qs=v.qs,ok=qs.filter(q=>q.ok).length,pct=Math.round(ok/qs.length*100),secs=Math.round((v.t1-v.t0)/1000);
  const R=46,C=2*Math.PI*R;if(!v.cheered){v.cheered=true;if(pct>=70)cheer(pct>=90?3:2)}
  app.innerHTML=`${studyHead('Test',s)}<h2>${pct>=90?'Hervorragend!':pct>=70?'Gut gemacht!':pct>=50?'Auf einem guten Weg':'Da geht noch was'}</h2>
  <div class="panel score"><svg class="ring" viewBox="0 0 110 110" role="img" aria-label="${pct} Prozent richtig"><circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--line)" stroke-width="10"/>${pct?'':'<!--'}<circle cx="55" cy="55" r="${R}" fill="none" stroke="${pct>=70?'var(--ok)':pct>=50?'var(--warn)':'var(--bad)'}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*pct/100} ${C}" transform="rotate(-90 55 55)"/>${pct?'':'-->'}<text x="55" y="62" text-anchor="middle" fill="var(--fg)" style="font:700 22px var(--f-display)">${pct}%</text></svg>
    <div style="display:grid;gap:4px"><span><strong style="color:var(--ok)">${ok} richtig</strong> · <strong style="color:var(--bad)">${qs.length-ok} falsch</strong></span><span class="small muted">Dauer: ${Math.floor(secs/60)} Min. ${secs%60} Sek.</span></div></div>
  <div class="row"><button class="primary" id="newt">Neuer Test</button>${qs.length-ok?`<button id="wrongs">Falsche mit Karteikarten üben</button>`:''}<button class="ghost" id="fin">Fertig</button></div>
  <div class="sec"><h3>Deine Antworten</h3></div>
  ${qs.map((q,i)=>{const c=s.cards.find(x=>x.id===q.id),sd=side(s,c,q.rev);
    let yours=q.a==null||q.a===''?'<em class="muted">keine Antwort</em>':q.type==='tf'?(q.a?'Wahr':'Falsch'):q.type==='mc'?esc(q.opts[q.a]):esc(q.a);
    return`<section class="panel res ${q.ok?'':'no'}"><span class="num small muted">${i+1} · ${q.ok?'Richtig':'Falsch'}</span><strong>${esc(sd.ask)}</strong>
    ${q.type==='tf'?`<span class="small">Aussage: ${esc(q.shown)}</span>`:''}<span class="small">Deine Antwort: ${yours}</span>${q.ok?'':`<span class="small">Richtig: <strong>${q.type==='tf'?(q.truth?'Wahr':'Falsch')+' – '+esc(sd.ans):esc(sd.ans)}</strong></span>`}</section>`}).join('')}`;
  bindQuit(s.id);
  $('#newt').onclick=()=>{v.phase='setup';v.warned=false;v.cheered=false;render()};$('#fin').onclick=()=>go({name:'set',sid:s.id});
  $('#wrongs')&&($('#wrongs').onclick=()=>startMode(s.id,'flash',{ids:qs.filter(q=>!q.ok).map(q=>q.id),dir:v.dir}));
}
function buildTest(v,s,pool){
  const picked=shuffle(pool).slice(0,v.count);const types=['tf','mc','write'].filter(t=>v.types[t]&&(t==='write'||s.cards.length>=2));if(!types.length)types.push('write');
  const per=Math.ceil(picked.length/types.length);
  v.qs=picked.map((c,i)=>{const type=types[Math.min(types.length-1,Math.floor(i/per))];const rev=dirRev(v.dir);const sd=side(s,c,rev);const q={id:c.id,type,rev,a:null};
    const others=[...new Set(shuffle(s.cards.filter(x=>x.id!==c.id).map(x=>rev?x.t:x.d)).filter(x=>x!==sd.ans))];
    if(type==='tf'){q.truth=Math.random()<.5||!others.length;q.shown=q.truth?sd.ans:others[0]}
    if(type==='mc')q.opts=shuffle([sd.ans,...others.slice(0,3)]);
    return q});
  v.warned=false}
function gradeTest(v,s){v.t1=now();v.qs.forEach(q=>{const c=s.cards.find(x=>x.id===q.id),sd=side(s,c,q.rev);
  if(q.type==='tf')q.ok=q.a===q.truth;else if(q.type==='mc')q.ok=q.a!=null&&q.opts[q.a]===sd.ans;else{const r=check(q.a||'',sd.ans);q.ok=r.res==='ok'||r.res==='almost'}})}

// ================= Zuordnen =================
function vMatch(){
  const v=S.view,s=S.sets[v.sid],p=progOf(s.id);const pool=deckCards(s,v);
  const fmt=ms=>(ms/1000).toFixed(1).replace('.',',')+' s';
  if(v.phase==='intro'||v.phase==='done'){
    const isDone=v.phase==='done',rec=isDone&&v.newBest;
    app.innerHTML=`${studyHead('Zuordnen',s)}
    ${isDone?`<h2>${rec?'Neue Bestzeit!':'Geschafft!'}</h2><div class="panel"><span class="lbl">Deine Zeit</span><span class="timer">${fmt(v.time)}</span>${v.pen?`<span class="small muted">inkl. ${v.pen} s Strafzeit für Fehler</span>`:''}</div>`
      :`<h2>Bereit zum Zuordnen?</h2><p class="muted" style="margin:0">Ordne alle Begriffe so schnell wie möglich ihrer Definition zu. Jeder Fehler kostet eine Sekunde extra.</p>`}
    ${p.best?`<span class="small muted">Bestzeit: ${fmt(p.best)}</span>`:''}
    ${optionsHtml(v,s)}
    <div class="row"><button class="primary" id="go">${isDone?'Nochmal spielen':'Spiel starten'}</button>${isDone?'<button class="ghost" id="fin">Fertig</button>':''}</div>`;
    bindQuit(s.id);bindOptions(v);$('#fin')&&($('#fin').onclick=()=>go({name:'set',sid:s.id}));
    $('#go').onclick=()=>{const pick=shuffle(pool).slice(0,Math.min(6,pool.length));
      v.tiles=shuffle(pick.flatMap(c=>{const rev=v.dir==='rev';return[{k:c.id,txt:rev?c.d:c.t,img:null},{k:c.id,txt:rev?c.t:c.d,img:rev?null:c.img}]})).map((t,i)=>({...t,i}));
      v.left=pick.length;v.sel=null;v.pen=0;v.t0=performance.now();v.phase='play';touchStudy(s.id,'match');render()};return}
  app.innerHTML=`${studyHead('Zuordnen',s,`<span class="timer" id="tm">0,0 s</span>`)}
  <div class="mgrid">${v.tiles.map(t=>`<button class="tile" data-i="${t.i}">${t.img?imgTag(t.img,'thumb'):''}<span>${esc(t.txt)}</span></button>`).join('')}</div>`;
  bindQuit(s.id);
  const tm=$('#tm');const tick=()=>{if(S.view!==v||v.phase!=='play')return;tm.textContent=fmt(performance.now()-v.t0+v.pen*1000);requestAnimationFrame(tick)};tick();
  app.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const t=v.tiles[+b.dataset.i];if(b.classList.contains('gone'))return;
    if(v.sel===null){v.sel=t.i;b.classList.add('sel');return}
    if(v.sel===t.i){v.sel=null;b.classList.remove('sel');return}
    const a=v.tiles[v.sel],ab=app.querySelector(`.tile[data-i="${v.sel}"]`);v.sel=null;ab.classList.remove('sel');
    if(a.k===t.k){ab.classList.add('gone');b.classList.add('gone');v.left--;
      if(!v.left){v.time=performance.now()-v.t0+v.pen*1000;v.newBest=!p.best||v.time<p.best;if(v.newBest){p.best=Math.round(v.time);qProg(s.id)}v.phase='done';render();cheer(v.newBest?3:2)}}
    else{v.pen++;[ab,b].forEach(x=>{x.classList.remove('bad');void x.offsetWidth;x.classList.add('bad')});setTimeout(()=>[ab,b].forEach(x=>x.classList.remove('bad')),350)}});
  hydrateImgs();
}

// ================= Start der App =================
async function startSession(user){
  S.uid=user.id;S.email=user.email||'';
  const c=cacheRead();
  S.paused={};S.hist=[];
  if(c){S.sets=c.sets||{};S.prog=c.prog||{};S.paused=c.paused||{};S.user=Object.assign({folders:[],settings:{}},c.user||{});S.server=new Set(c.server||[]);
    const p=c.P||{};(p.sets||[]).forEach(x=>P.sets.add(x));(p.cards||[]).forEach(x=>P.cards.add(x));(p.delCards||[]).forEach(x=>P.delCards.add(x));(p.delSets||[]).forEach(x=>P.delSets.add(x));(p.prog||[]).forEach(x=>P.prog.add(x));P.user=!!p.user}
  S.view={name:'home'};render();
  await loadAll();
}
async function init(){
  if(!window.supabase){app.innerHTML='<div class="banner err">Die App konnte nicht geladen werden. Bitte Internetverbindung prüfen und neu laden.</div>';return}
  S.sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data:{session}}=await S.sb.auth.getSession();
  if(session)startSession(session.user);else renderLogin();
  S.sb.auth.onAuthStateChange((ev,sess)=>{if(ev==='SIGNED_IN'&&sess&&S.uid!==sess.user.id)startSession(sess.user)});
}
init();
</script>
