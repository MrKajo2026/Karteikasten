<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4fd1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Karteikasten">
<title>Karteikasten</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: eine schmale Spalte wie ein Karteikasten; feste Navigation unten; Fächer 1–5 als wiederkehrendes Motiv */
:root{
  --bg:#eef2f6; --surface:#ffffff; --sunk:#f6f8fb; --line:#d5dde6; --fg:#16202b; --muted:#5b6a7a;
  --ink:#1f4fd1; --ink-soft:#e3eafc; --on-ink:#ffffff; --mark:#f5d547; --ok:#1d8a55; --ok-soft:#dcf2e6; --bad:#c23b3b; --bad-soft:#fbe3e3; --warn:#b7791f; --warn-soft:#fbf0d9;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --r:12px; --nav:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#18202a; --sunk:#131a22; --line:#2a3542; --fg:#e8eef5; --muted:#93a2b3;
  --ink:#7ea2ff; --ink-soft:#1d2a4a; --on-ink:#0f141b; --mark:#e2c341; --ok:#4cc58a; --ok-soft:#163626; --bad:#ff7b7b; --bad-soft:#3d1c1c; --warn:#e0b25a; --warn-soft:#3a2e15; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#18202a; --sunk:#131a22; --line:#2a3542; --fg:#e8eef5; --muted:#93a2b3;
  --ink:#7ea2ff; --ink-soft:#1d2a4a; --on-ink:#0f141b; --mark:#e2c341; --ok:#4cc58a; --ok-soft:#163626; --bad:#ff7b7b; --bad-soft:#3d1c1c; --warn:#e0b25a; --warn-soft:#3a2e15; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--bg);color:var(--fg)}
body{font:16px/1.5 var(--f-body);margin:0;-webkit-tap-highlight-color:transparent}
body.nav{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;min-height:56px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.25rem;letter-spacing:-.01em}
h2{font-size:1.55rem}
h3{font-size:1.08rem}
.logo{display:flex;gap:3px;align-items:flex-end}
.logo i{display:block;width:5px;background:var(--ink);border-radius:2px}
.status{margin-left:auto;font-size:.8rem;color:var(--muted);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.lbl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sec{display:flex;align-items:baseline;gap:8px}
.sec h3{flex:1}
button,.btn{font:inherit;font-weight:700;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none;line-height:1.3}
button:hover,.btn:hover{border-color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.primary,.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
button.ghost{border-color:transparent;background:transparent;padding:6px 8px}
button.danger{color:var(--bad);border-color:var(--bad)}
button.okb{background:var(--ok);border-color:var(--ok);color:var(--on-ink)}
button:disabled{opacity:.45;cursor:not-allowed}
button.icon{padding:6px;min-width:36px;min-height:36px;border-color:transparent;background:transparent;font-size:1.05rem}
input,textarea,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:42px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.banner{border:1px solid var(--line);border-left:4px solid var(--mark);background:var(--surface);border-radius:var(--r);padding:12px 14px;font-size:.92rem}
.banner.err{border-left-color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:12px}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:grid;gap:12px;justify-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--ink-soft);color:var(--ink);white-space:nowrap}
.chip.y{background:var(--mark);color:#1b1b1b}
.chip.g{background:var(--ok-soft);color:var(--ok)}
.search{position:relative}
.search input{padding-left:36px}
.search::before{content:"";position:absolute;left:12px;top:50%;width:13px;height:13px;border:2px solid var(--muted);border-radius:50%;transform:translateY(-60%)}
.search::after{content:"";position:absolute;left:24px;top:58%;width:7px;height:2px;background:var(--muted);transform:rotate(45deg)}
/* Navigation unten */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bar .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.bar button{border:0;background:transparent;flex-direction:column;gap:2px;font-size:.72rem;font-weight:700;color:var(--muted);border-radius:0;padding:6px 0}
nav.bar button[aria-current="page"]{color:var(--ink)}
nav.bar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.bar .plus svg{background:var(--ink);stroke:var(--on-ink);border-radius:10px;width:40px;height:30px;padding:4px 10px}
/* Listen von Sets */
.sets{display:grid;gap:10px}
.set{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;cursor:pointer;text-align:left;font-weight:400;width:100%;justify-content:stretch;justify-items:stretch;align-content:start}
.set:hover{border-color:var(--ink)}
.set .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.set .top h3{flex:1;min-width:0;overflow-wrap:anywhere}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.hscroll .set{min-width:220px;max-width:260px;scroll-snap-align:start}
.bar3{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line)}
.bar3 span{display:block;height:100%}
.bar3 .m{background:var(--ok)}.bar3 .l{background:var(--warn)}
.cont{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;border-top:4px solid var(--ink)}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.folder{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;font-weight:400;display:grid;gap:2px;cursor:pointer;justify-content:stretch;justify-items:start}
.folder strong{font-family:var(--f-display);overflow-wrap:anywhere}
.folder::before{content:"";display:block;width:26px;height:18px;border:2px solid var(--ink);border-radius:3px 3px 4px 4px;margin-bottom:6px;background:linear-gradient(var(--ink) 0 0) 0 -2px/12px 5px no-repeat}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:8px 10px;white-space:nowrap}
.tabs button[aria-selected=true]{border-bottom-color:var(--ink);color:var(--ink)}
/* Set-Seite */
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mode{display:flex;align-items:center;gap:12px;text-align:left;justify-content:flex-start;padding:12px 14px;font-weight:400}
.mode svg{width:28px;height:28px;flex:none;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mode strong{font-family:var(--f-display);font-size:1.02rem;display:block}
.mode span{font-size:.8rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats button{display:grid;gap:2px;justify-items:start;text-align:left;font-weight:400;padding:10px 12px}
.stats b{font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stats .n b{color:var(--muted)}.stats .l b{color:var(--warn)}.stats .m b{color:var(--ok)}
.stats button[aria-pressed=true]{border-color:var(--ink);background:var(--ink-soft)}
.terms{display:grid;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.term{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.term:first-child{border-top:0}
.term .t{font-weight:700;overflow-wrap:anywhere}
.term .d{overflow-wrap:anywhere;display:flex;gap:8px;align-items:flex-start}
.term .d img,.thumb{width:48px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:none}
.term .acts{display:flex;gap:0}
.star{color:var(--muted)}
.star[aria-pressed=true]{color:var(--warn)}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:calc(100% + 4px);z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgb(0 0 0 / .14);display:grid;min-width:220px;padding:4px}
.menu .pop button{border:0;justify-content:flex-start;font-weight:400;border-radius:6px}
.menu .pop button:hover{background:var(--sunk)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);border-radius:10px;padding:10px 12px}
/* Bearbeiten */
.erow{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:start;padding:10px 12px;border-top:1px solid var(--line)}
.erow:first-child{border-top:0}
.erow .no{font-size:.8rem;color:var(--muted);padding-top:10px;font-variant-numeric:tabular-nums}
.erow .side{display:flex;flex-direction:column;gap:4px;align-items:center}
.erow .imgbox{display:flex;gap:6px;align-items:center;grid-column:3}
/* Lernen allgemein */
.studyhead{display:flex;gap:8px;align-items:center}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--ink);transition:width .25s}
.prompt{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:8px}
.prompt .w{font-family:var(--f-display);font-size:clamp(1.3rem,4.6vw,1.9rem);font-weight:700;overflow-wrap:anywhere;line-height:1.25}
.prompt img{max-height:180px;width:auto;border-radius:8px;justify-self:start}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{justify-content:flex-start;text-align:left;font-weight:400;padding:12px 14px;min-height:56px}
.opt .k{font-size:.75rem;color:var(--muted);font-weight:700;border:1px solid var(--line);border-radius:5px;padding:0 5px;flex:none}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--fg)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--fg)}
.fb{border-radius:var(--r);padding:12px 14px;display:grid;gap:4px}
.fb.ok{background:var(--ok-soft)}.fb.no{background:var(--bad-soft)}.fb.al{background:var(--warn-soft)}
/* Karteikarten */
.deck{position:relative;min-height:300px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.fcard{position:absolute;inset:0;perspective:1400px;cursor:pointer}
.fcard .inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fcard.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:16px;display:grid;place-items:center;padding:48px 20px 24px;text-align:center;overflow:auto;
  background-image:repeating-linear-gradient(transparent 0 31px,var(--ink-soft) 31px 32px);background-position:0 56px}
.face .w{font-family:var(--f-display);font-size:clamp(1.3rem,5vw,2.1rem);font-weight:700;overflow-wrap:anywhere;max-width:100%;display:grid;gap:10px;justify-items:center}
.face .w img{max-height:150px;width:auto;border-radius:8px}
.face .lbl{position:absolute;top:14px;left:16px}
.face .tools{position:absolute;top:6px;right:8px;display:flex}
.face.back{transform:rotateY(180deg)}
.face.back::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--mark);border-radius:16px 0 0 16px}
.swipe-l .face{border-color:var(--warn);box-shadow:inset 0 0 0 3px var(--warn)}
.swipe-r .face{border-color:var(--ok);box-shadow:inset 0 0 0 3px var(--ok)}
.counts{display:flex;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums}
.counts .l{color:var(--warn)}.counts .r{color:var(--ok)}
.fbtns{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px}
@media (prefers-reduced-motion:reduce){.fcard .inner,.progress span{transition:none}}
/* Zuordnen */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{min-height:92px;padding:8px;font-weight:400;font-size:.9rem;overflow-wrap:anywhere;hyphens:auto;line-height:1.25}
.tile.sel{border-color:var(--ink);background:var(--ink-soft)}
.tile.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
.tile.gone{visibility:hidden}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.tile.bad{animation:none}}
.timer{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
/* Test */
.q{display:grid;gap:10px}
.q .num{font-size:.8rem;color:var(--muted)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice[aria-pressed=true]{border-color:var(--ink);background:var(--ink-soft)}
.score{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{width:110px;height:110px}
.res{border-left:4px solid var(--ok)}.res.no{border-left-color:var(--bad)}
/* Import */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;display:grid;gap:8px;justify-items:center}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:72px;height:96px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.rev{display:grid;gap:6px}
.rev .r{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center}
.rev .r input[type=checkbox]{width:20px;height:20px}
.rev .flag{grid-column:2/-1;font-size:.78rem;color:var(--muted);margin-top:-2px}
.rev .flag.dup{color:var(--bad)}
/* Overlays */
.sheet{position:fixed;inset:0;z-index:30;background:rgb(0 0 0 / .4);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;max-height:85vh;overflow:auto}
@media (min-width:640px){.sheet{align-items:center}.sheet .box{border-radius:16px}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:40;max-width:calc(100% - 32px);display:flex;gap:10px;align-items:center}
.av{display:inline-grid;place-items:center;flex:none;border-radius:50%;background:var(--ink-soft) center/cover no-repeat;color:var(--ink);font-family:var(--f-display);font-weight:700;overflow:hidden;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.av.has{color:transparent}
button.me{padding:0;border:0;background:transparent;border-radius:50%}
.toggle{display:flex;align-items:center;gap:10px;justify-content:space-between}
.toggle input{width:auto;transform:scale(1.3)}
.checks{display:grid;gap:8px}
.checks label{display:flex;gap:10px;align-items:center}
.checks input{width:auto;transform:scale(1.2)}
@media (max-width:520px){
  .modes{grid-template-columns:1fr 1fr}
  .term{grid-template-columns:minmax(0,1fr) auto}.term .d{grid-column:1;grid-row:2}.term .acts{grid-row:1/3;grid-column:2;flex-direction:column}
  .erow{grid-template-columns:22px minmax(0,1fr) auto}.erow .dcol{grid-column:2}.erow .side{grid-row:1/3;grid-column:3}.erow .imgbox{grid-column:2}
  .opts{grid-template-columns:1fr}
  .rev .r{grid-template-columns:auto 1fr}.rev .r input.d{grid-column:2}
  .stats b{font-size:1.25rem}
}
@media (min-width:640px){.mgrid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><div class="in">
  <div class="logo" aria-hidden="true"><i style="height:10px"></i><i style="height:14px"></i><i style="height:18px"></i><i style="height:22px"></i><i style="height:26px"></i></div>
  <h1>Karteikasten</h1>
  <span class="status" id="status" aria-live="polite"></span>
  <button class="me" id="me" hidden aria-label="Profil"></button>
</div></header>
<main class="wrap" id="app"></main>
<nav class="bar" id="nav" hidden><div class="in">
  <button data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Start</button>
  <button data-nav="library"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="16" rx="1"/><path d="M17.5 5l3 .8-3.6 14-3-.8"/></svg>Bibliothek</button>
  <button data-nav="create" class="plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Erstellen</button>
  <button data-nav="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profil</button>
</div></nav>
<div id="sheet"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ===== KONFIGURATION =====
const SUPABASE_URL='https://xhbocgunjbrnyrzjsysx.supabase.co';
const SUPABASE_KEY='sb_publishable_hg0dmW8eAhQyHMt8Vuhufw_4MvX6dCQ';
const SCAN_FUNCTION='smart-service';
// =========================

const INTERVALS=[0,1,2,4,8,16]; // Tage bis zur nächsten Abfrage je Fach 1–5
const DAY=86400000;
const LANGS={'Englisch':'en-GB','Deutsch':'de-DE','Französisch':'fr-FR','Spanisch':'es-ES','Italienisch':'it-IT','Niederländisch':'nl-NL','Portugiesisch':'pt-PT','Polnisch':'pl-PL','Russisch':'ru-RU','Türkisch':'tr-TR','Schwedisch':'sv-SE','Latein':'it-IT','Japanisch':'ja-JP','Chinesisch':'zh-CN'};
const MODE_NAMES={flash:'Karteikarten',learn:'Lernen',test:'Test',match:'Zuordnen',srs:'Wiederholen'};
const ICONS={
  flash:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v10"/></svg>',

// ================= Plausibilitätsprüfung erkannter Begriffe =================
const LCODE={'Englisch':'en','Deutsch':'de','Französisch':'fr','Spanisch':'es','Italienisch':'it','Niederländisch':'nl','Portugiesisch':'pt','Polnisch':'pl','Russisch':'ru','Türkisch':'tr','Schwedisch':'sv','Latein':'la','Japanisch':'ja','Chinesisch':'zh'};
// Spracherkennung Deutsch/Englisch (Heuristik)
const DE_W=new Set('der die das den dem des ein eine einen einem einer und oder nicht zu zum zur mit von für auf aus bei nach über unter sich etw etwas jdn jdm jmd jemand jemanden jemandem hier etwa auch ist sind wird werden durch gegen ohne um am im vom ins beim als wie dass'.split(' '));
const EN_W=new Set('the a an and or not to of for on in at by with from somebody something someone sb sth is are be been into out up off over under as that this which who'.split(' '));
const DE_SUF=/(ung|ungen|keit|heit|schaft|lich|isch|ieren|iert|chen|nis|tät|igkeit|enden?|bar)$/;
const EN_SUF=/(tion|tions|sion|ness|ment|ments|ity|ous|ive|ful|less|ence|ance|ing|ed|ship|able|ible|ize|ise|ly|ary|ory|ure)$/;
function langScore(text){
  const t=String(text).replace(/\([^)]*\)/g,' ').replace(/^(hier etwa|hier|etwa)\s*:/i,' ');
  let de=0,en=0;
  if(/[äöüß]/i.test(t))de+=3;
  const words=t.toLowerCase().match(/[a-zäöüß]+/g)||[];
  for(const w of words){
    if(DE_W.has(w))de+=2;if(EN_W.has(w))en+=2;
    if(w.length>4&&DE_SUF.test(w))de+=1;if(w.length>4&&EN_SUF.test(w))en+=1;
    if(/sch|tz|ck|pf|ei|ie|au|eu/.test(w))de+=.5; if(/th|wh|ph|ght|ea|oo|ou|w/.test(w))en+=.5;
  }
  // deutsche Substantive: Großschreibung mitten im Text
  (t.match(/(^|[\s,(\/-])[A-ZÄÖÜ][a-zäöüß]{3,}/g)||[]).forEach(()=>de+=2);
  for(const w of words){if(w.length>4&&/en$/.test(w)&&!/(ten|ken|zen|men|ven|wen|een|oen)$/.test(w))de+=1.2}
  return{de,en}}
function detect(text){const {de,en}=langScore(text);if(de-en>=2)return'de';if(en-de>=2)return'en';return null}
// Liefert Hinweise je Paar. hard=true: Zeile wird abgewählt und muss bewusst bestätigt werden.
function pairIssues(t,d,s,model){
  const out=[],fc=LCODE[s.from],tc=LCODE[s.to],T=String(t||'').trim(),D=String(d||'').trim();
  if(!T||!D){out.push({hard:true,msg:'Begriff oder Definition fehlt'});return out}
  if(norm(T)===norm(D))out.push({hard:true,msg:'Begriff und Definition sind gleich'});
  if(/^[\d\s.,\/-]+$/.test(T)||/^[\d\s.,\/-]+$/.test(D))out.push({hard:true,msg:'Sieht aus wie eine Zahl oder Seitenzahl'});
  if(T.length>90)out.push({hard:false,msg:'Begriff ungewöhnlich lang – evtl. zwei Zeilen zusammengezogen'});
  // Sprache: Angabe der KI (falls vorhanden), sonst eigene Erkennung (nur Deutsch/Englisch)
  const heur=fc!==tc&&['de','en'].includes(fc)&&['de','en'].includes(tc);
  const tl=(model&&model.term_lang)||(heur?detect(T):null),dl=(model&&model.def_lang)||(heur?detect(D):null);
  const tWrong=tl&&fc&&tl!==fc&&tl===tc,dWrong=dl&&tc&&dl!==tc&&dl===fc;
  if(tWrong&&(dWrong||dl!==tc))out.push({hard:true,swap:true,msg:`Spalten vertauscht: Begriff wirkt ${s.to}`});
  else if(tWrong)out.push({hard:true,msg:`Begriff wirkt ${s.to} statt ${s.from}`});
  else if(dWrong)out.push({hard:true,msg:`Definition wirkt ${s.from} statt ${s.to}`});
  if(model&&model.unsicher)out.push({hard:false,msg:'Erkennung unsicher'+(model.hinweis?': '+model.hinweis:'')});
  return out}
// Automatischer Import: tauscht vertauschte Spalten, verwirft Doppelte/Leeres/Zahlen, übernimmt Sauberes sofort.
// Nur echte Zweifelsfälle (z. B. Deutsch auf beiden Seiten) kommen zurück.
function autoImport(s,pairs){
  const res={added:0,swapped:0,skipped:0,dropped:0,doubts:[]};const ok=[];
  const have=new Set(s.cards.map(c=>ckey(c.t,c.d)));
  for(const p of pairs){let t=String(p.term||'').trim(),d=String(p.definition||'').trim(),model=p;
    let iss=pairIssues(t,d,s,model);
    if(iss.some(i=>i.swap)){[t,d]=[d,t];model=p.term_lang?{term_lang:p.def_lang,def_lang:p.term_lang}:null;iss=pairIssues(t,d,s,model);res.swapped++}
    if(!t||!d||iss.some(i=>/Seitenzahl|fehlt/.test(i.msg))){res.dropped++;continue}
    const k=ckey(t,d);if(have.has(k)){res.skipped++;continue}
    if(iss.some(i=>i.hard)){res.doubts.push({term:t,definition:d,msg:iss.filter(i=>i.hard).map(i=>i.msg).join(' · ')});continue}
    have.add(k);ok.push({term:t,definition:d})}
  res.added=addCards(s.id,ok).added;return res}

function speak(text,lang){
  if(!('speechSynthesis' in window)){toast('Dein Browser unterstützt keine Sprachausgabe.');return}
  const t=String(text).replace(/\([^)]*\)/g,' ').replace(/^(hier etwa|hier|etwa)\s*:/i,'').trim();

  const v=speechSynthesis.getVoices().find(v=>v.lang===code)||speechSynthesis.getVoices().find(v=>v.lang.startsWith(code.slice(0,2)));if(v)u.voice=v;
  speechSynthesis.speak(u)}

// ================= Antwortprüfung =================
function norm(s){return String(s).toLowerCase().replace(/\([^)]*\)|\[[^\]]*\]/g,' ').replace(/[.!?¡¿"„“”'’:]/g,'').replace(/\s+/g,' ').trim()}
const ART=/^(to|the|a|an|der|die|das|den|dem|des|ein|eine|einen|einem|sich|jmd|jdn|jdm|etw)\s+/;
function core(s){let x=norm(s),p;do{p=x;x=x.replace(ART,'')}while(x!==p);return x}
function variants(ans){
  const out=new Set([ans]);
  String(ans).split(/[,;]/).map(x=>x.trim()).filter(Boolean).forEach(p=>{
    const c=p.replace(/^(hier etwa|hier|etwa|z\.\s?b\.|jurist\.\s*auch|auch)\s*:\s*/i,'').trim();out.add(p);out.add(c);
    const m=c.match(/^(.*?)\(([^)]{1,3})\)(.*)$/);if(m){out.add(m[1]+m[3]);out.add(m[1]+m[2]+m[3])}
    if(c.includes('/')){const seg=c.split('/').map(x=>x.trim());
      if(seg.length===2&&seg[1].length<=3&&!/\s/.test(seg[1])){out.add(seg[0]);out.add(seg[0]+seg[1])}
      else seg.forEach(x=>x&&!x.endsWith('-')&&out.add(x))}
  });
  return[...out].filter(Boolean)}
function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]}
function check(input,ans){
  const inp=norm(input);if(!inp)return{res:'no'};
  const vs=variants(ans);
  if(vs.some(a=>norm(a)===inp))return{res:'ok'};
  const ci=core(input);
  if(ci&&vs.some(a=>core(a)===ci))return{res:'almost',msg:'Richtig. Achte auf den vollständigen Eintrag (Artikel bzw. „to“).'};
  if(vs.some(a=>{const c=core(a);return c.length>4&&lev(c,ci)<=(c.length>10?2:1)}))return{res:'typo'};
  return{res:'no'}}

async function hydrateImgs(){
  const els=[...document.querySelectorAll('img[data-img]')];if(!els.length||!S.sb)return;
  const need=[...new Set(els.map(e=>e.dataset.img).filter(p=>!S.imgUrls[p]||S.imgUrls[p].exp<now()))];
  if(need.length){const {data}=await S.sb.storage.from('card-images').createSignedUrls(need,3600);(data||[]).forEach(r=>{if(r.signedUrl)S.imgUrls[r.path]={url:r.signedUrl,exp:now()+3300e3}})}
  els.forEach(e=>{const u=S.imgUrls[e.dataset.img];if(u)e.src=u.url})}
const imgTag=(p,cls='')=>p?`<img data-img="${esc(p)}" alt="Bild zur Karte" class="${cls}">`:'';
async function shrink(file,max,lim){
  const bmp=await createImageBitmap(file);const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  let q=.85,b;do{b=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));q-=.15}while(b.size>lim&&q>.2);return b}
async function setCardImage(sid,cid,file){
  const f=findCard(cid);if(!f)return;
  try{setStatus('Lade Bild hoch…');await flush();
    const blob=await shrink(file,900,600e3);const path=`${sid}/${cid}-${uid()}.jpg`;
    const {error}=await S.sb.storage.from('card-images').upload(path,blob,{contentType:'image/jpeg'});if(error)throw error;
    const old=f.c.img;f.c.img=path;qCard(cid);if(old)S.sb.storage.from('card-images').remove([old]);render();
  }catch(e){toast('Bild konnte nicht hochgeladen werden: '+(e.message||e))}}
function removeCardImage(cid){const f=findCard(cid);if(!f||!f.c.img)return;const old=f.c.img;f.c.img=null;qCard(cid);S.sb?.storage.from('card-images').remove([old]);render()}

const avPath=u=>`${u}/avatar.jpg`;
const displayName=()=>(S.user.settings?.name||'').trim()||S.email.split('@')[0];
function avatarHtml(u,label,size=36){const ini=esc(String(label||'?').trim().charAt(0).toUpperCase()||'?');
  return`<span class="av" data-av="${esc(u)}" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.42)}px" role="img" aria-label="Profilbild ${esc(label||'')}">${ini}</span>`}
async function hydrateAvatars(force){
  const els=[...document.querySelectorAll('[data-av]')];if(!els.length||!S.sb)return;S.av=S.av||{};
  for(const u of [...new Set(els.map(e=>e.dataset.av))]){const c=S.av[u];
    if(force===u||!c||c.exp<now()){const {data,error}=await S.sb.storage.from('avatars').createSignedUrl(avPath(u),3600).catch(e=>({error:e}));
      S.av[u]={url:!error&&data?.signedUrl?data.signedUrl:null,exp:now()+(error?600e3:3300e3)}}}
  document.querySelectorAll('[data-av]').forEach(e=>{const c=S.av[e.dataset.av];if(c&&c.url){e.style.backgroundImage=`url("${c.url}")`;e.classList.add('has')}else{e.style.backgroundImage='';e.classList.remove('has')}})}
async function squareJpeg(file,size){const bmp=await createImageBitmap(file);const m=Math.min(bmp.width,bmp.height);
  const cv=document.createElement('canvas');cv.width=cv.height=size;cv.getContext('2d').drawImage(bmp,(bmp.width-m)/2,(bmp.height-m)/2,m,m,0,0,size,size);
  return new Promise(r=>cv.toBlob(r,'image/jpeg',.88))}
async function uploadAvatar(file){
  try{setStatus('Lade Profilbild hoch…');const blob=await squareJpeg(file,320);
    const {error}=await S.sb.storage.from('avatars').upload(avPath(S.uid),blob,{contentType:'image/jpeg',upsert:true});if(error)throw error;
    S.avVer=now();delete (S.av||{})[S.uid];setStatus('Gespeichert');toast('Profilbild gespeichert');render()
  }catch(e){setStatus('');toast(/bucket|not found|policy/i.test(e.message||'')?'Profilbilder sind noch nicht eingerichtet: Bitte supabase/setup-v3.sql ausführen.':'Profilbild konnte nicht gespeichert werden: '+(e.message||e))}}
async function removeAvatar(){const {error}=await S.sb.storage.from('avatars').remove([avPath(S.uid)]);if(error){toast('Fehler: '+error.message);return}
  S.av[S.uid]={url:null,exp:now()+3300e3};toast('Profilbild entfernt');render()}

    try{const j=JSON.parse(await f.text());let n=0;
      for(const s of Object.values(j.sets||{})){if(!s||!Array.isArray(s.cards))continue;
        const names=new Set(Object.values(S.sets).map(x=>x.name));const id=newSet(names.has(s.name)?s.name+' (Import)':s.name||'Import');const ns=S.sets[id];ns.from=s.from||'Englisch';ns.to=s.to||'Deutsch';
        s.cards.forEach((c,i)=>{if(!c||!c.t)return;const cid=uid();ns.cards.push({id:cid,t:c.t,d:c.d||'',img:null,pos:i});qCard(cid);
          cp(id,cid);Object.assign(progOf(id).c[cid],{box:c.box||1,due:c.due||0,ok:c.ok||0,no:c.no||0,lv:c.lv||0,seen:!!(c.seen||c.ok||c.no),star:!!c.star})});
        qProg(id);qSet(id);n++}
      toast(n+' Lernsets eingespielt');go({name:'library'})}catch(err){toast('Die Datei ist keine gültige Sicherung.')}e.target.value=''};
}

// ================= Lernset =================

  <div class="sec"><h3>Dein Lernstand</h3></div>

  :`<div class="empty"><h3>Noch keine Begriffe</h3><p class="muted small" style="margin:0">Füge Begriffe hinzu oder fotografiere eine Vokabelseite.</p><div class="row" style="justify-content:center"><button class="primary" id="e2">Begriffe hinzufügen</button><button id="p2">Seite fotografieren</button></div></div>`}

  app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{$('#spop').hidden=true;const a=b.dataset.a,x=$('#sx');

    if(a==='reset')confirmIn(x,'Deinen Lernstand für dieses Set komplett zurücksetzen? Markierungen (★) bleiben.','Zurücksetzen',()=>{const p=progOf(s.id);Object.keys(p.c).forEach(k=>p.c[k]={star:!!p.c[k].star,box:1,due:0,ok:0,no:0,lv:0,seen:false});p.best=null;qProg(s.id);render();toast('Lernstand zurückgesetzt')});

      const imgs=s.cards.map(c=>c.img).filter(Boolean);if(imgs.length&&S.sb)S.sb.storage.from('card-images').remove(imgs);
      s.cards.forEach(c=>P.cards.delete(c.id));delete S.sets[s.id];delete S.prog[s.id];P.prog.delete(s.id);P.sets.delete(s.id);
      if(S.server.has(s.id))P.delSets.add(s.id);S.user.folders.forEach(f=>f.sets=f.sets.filter(i=>i!==s.id));qUser();go({name:'library'});toast('Lernset gelöscht')});
    if(a==='leave')confirmIn(x,`„${s.name}“ verlassen? Es verschwindet aus deiner Bibliothek, dein Lernstand wird gelöscht.`,'Verlassen',async()=>{
      const r1=await S.sb.from('set_members').delete().eq('set_id',s.id).eq('user_id',S.uid);if(r1.error){toast('Fehler: '+r1.error.message);return}
      await S.sb.from('progress').delete().eq('set_id',s.id).eq('user_id',S.uid);
      delete S.sets[s.id];delete S.prog[s.id];P.prog.delete(s.id);S.user.folders.forEach(f=>f.sets=f.sets.filter(i=>i!==s.id));qUser();go({name:'library'});toast('Lernset verlassen')});
  });
  if(!n)return;
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>startMode(s.id,b.dataset.mode));

  drawPrev();$('#pprev').onclick=()=>{v.pi=(v.pi-1+n)%n;render()};$('#pnext').onclick=()=>{v.pi=(v.pi+1)%n;render()};
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const f=b.dataset.f;v.filter=v.filter===f&&f!=='all'?'all':f;render()});
  $('#sort').onchange=e=>{v.sort=e.target.value;drawTerms()};
  const drawTerms=()=>{let list=[...s.cards];
    if(v.filter==='star')list=list.filter(x=>isStar(s.id,x.id));else if(['n','l','m'].includes(v.filter))list=list.filter(x=>status(s.id,x.id)===v.filter);
    if(v.sort==='alpha')list.sort((a,b)=>a.t.localeCompare(b.t,'de'));
    $('#terms').innerHTML=list.length?list.map(x=>`<div class="term"><span class="t">${esc(x.t)}</span><span class="d">${imgTag(x.img)}<span>${esc(x.d)}</span></span>
      <span class="acts">${spk(x.t,s.from)}<button class="icon star" data-star="${x.id}" aria-pressed="${isStar(s.id,x.id)}" aria-label="Markieren">★</button></span></div>`).join('')
      :`<div class="term" style="grid-template-columns:1fr"><span class="muted small">${v.filter==='star'?'Noch keine markierten Begriffe. Tippe auf ★, um schwierige Begriffe zu sammeln.':'Keine Begriffe in dieser Gruppe.'}</span></div>`;
    bindStar($('#terms'),s,()=>{if(v.filter==='star')render()});hydrateImgs()};
  drawTerms();
}
function bindStar(root,s,after){root.querySelectorAll('[data-star]').forEach(b=>b.onclick=e=>{e.stopPropagation();const c=cp(s.id,b.dataset.star);c.star=!c.star;qProg(s.id);
  root.querySelectorAll(`[data-star="${b.dataset.star}"]`).forEach(x=>x.setAttribute('aria-pressed',c.star));after&&after()})}
function openFolderPick(s){const fs=S.user.folders||[];
  openSheet(`<h3>„${esc(s.name)}“ in Ordner</h3>${fs.length?`<div class="checks">${fs.map(f=>`<label><input type="checkbox" value="${f.id}" ${f.sets.includes(s.id)?'checked':''}>${esc(f.name)}</label>`).join('')}</div>`:'<p class="muted small" style="margin:0">Noch keine Ordner.</p>'}
  <div class="row"><input id="nfn" class="grow" placeholder="Neuer Ordner" maxlength="60"><button id="nfok">Anlegen</button></div><button class="primary" id="fok">Fertig</button>`,x=>{

function vEdit(){
  const s=S.sets[S.view.sid];const langs=Object.keys(LANGS);
  const opt=cur=>langs.map(l=>`<option ${l===cur?'selected':''}>${l}</option>`).join('');
  app.innerHTML=`<div class="row"><button class="ghost" id="back">← Fertig</button><span class="grow"></span><button class="primary" id="done">Fertig</button></div>
  <div class="panel"><label class="lbl" for="en">Titel</label><input id="en" value="${esc(s.name)}" maxlength="80">
    <div class="row"><div class="grow"><label class="lbl" for="ef">Begriff</label><select id="ef">${opt(s.from)}</select></div><div class="grow"><label class="lbl" for="et">Definition</label><select id="et">${opt(s.to)}</select></div></div></div>
  <div class="row"><button id="photo">Seite fotografieren</button><button id="paste">Liste einfügen</button></div>
  <div class="panel" id="pf" hidden><label class="lbl" for="pt">Eine Zeile pro Begriff, getrennt durch Tab, Semikolon oder " - "</label><textarea id="pt" rows="6" placeholder="reckless; rücksichtslos&#10;theft - Diebstahl"></textarea><div class="row"><button class="primary" id="ptok">Übernehmen</button></div></div>
  <div class="terms" id="rows"></div>
  <div class="panel"><span class="lbl">Neuer Begriff</span><div class="row"><input id="nt" class="grow" placeholder="${esc(s.from)}" aria-label="Begriff"><input id="nd" class="grow" placeholder="${esc(s.to)}" aria-label="Definition"><button class="primary" id="add">+ Hinzufügen</button></div><span class="small muted">Enter springt ins nächste Feld und fügt dann hinzu.</span></div>`;
  const back=()=>{flush();go({name:'set',sid:s.id})};$('#back').onclick=back;$('#done').onclick=back;
  $('#en').oninput=e=>{const v=e.target.value.trim();if(v){s.name=v;qSet(s.id)}};
  $('#ef').onchange=e=>{s.from=e.target.value;qSet(s.id)};$('#et').onchange=e=>{s.to=e.target.value;qSet(s.id)};
  $('#photo').onclick=()=>go({name:'import',sid:s.id,files:[],rows:null,back:'edit'});
  $('#paste').onclick=()=>{$('#pf').hidden=false;$('#pt').focus()};
  $('#ptok').onclick=()=>{const pairs=$('#pt').value.split('\n').map(l=>{const m=l.split(/\t|;| - | – /);return m.length>=2?{term:m[0],definition:m.slice(1).join(', ')}:null}).filter(Boolean);
    if(!pairs.length){toast('Keine Zeile erkannt. Trenne Begriff und Definition mit Tab oder Semikolon.');return}const r=autoImport(s,pairs);if(!r.doubts.length){toast(`${r.added} übernommen`+(r.swapped?`, ${r.swapped} getauscht`:'')+(r.skipped?`, ${r.skipped} doppelte übersprungen`:''));$('#pt').value='';$('#pf').hidden=true;drawRows()}else go({name:'import',sid:s.id,files:[],rows:true,result:r,back:'edit'})};
  const add=()=>{const t=$('#nt').value.trim(),d=$('#nd').value.trim();if(!t||!d){(t?$('#nd'):$('#nt')).focus();return}
    const iss=pairIssues(t,d,s,null);const r=addCards(s.id,[{term:t,definition:d}]);if(r.skipped)toast('Diesen Begriff gibt es mit dieser Definition schon.');
    else if(iss.length){const c=s.cards[s.cards.length-1];toast('Bitte prüfen: '+iss[0].msg,{label:'Rückgängig',fn:()=>{s.cards=s.cards.filter(x=>x!==c);qDelCard(c.id);qSet(s.id);drawRows()}})}$('#nt').value='';$('#nd').value='';drawRows();$('#nt').focus()};
  $('#add').onclick=add;$('#nt').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#nd').focus()}};$('#nd').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}};
  function drawRows(){const box=$('#rows');
    box.innerHTML=s.cards.length?s.cards.map((c,i)=>`<div class="erow" data-c="${c.id}"><span class="no">${i+1}</span>
      <textarea rows="1" class="tcol" data-k="t" aria-label="Begriff ${i+1}">${esc(c.t)}</textarea>
      <div class="dcol" style="display:grid;gap:6px"><textarea rows="1" data-k="d" aria-label="Definition ${i+1}">${esc(c.d)}</textarea>
        <div class="row small">${c.img?`${imgTag(c.img,'thumb')}<button class="ghost small" data-rmimg>Bild entfernen</button>`:`<label class="btn ghost small" style="padding:4px 6px;font-weight:400">🖼 Bild<input type="file" accept="image/*" data-img hidden></label>`}</div></div>
      <span class="side"><button class="icon" data-del aria-label="Begriff löschen">🗑</button></span></div>`).join('')
      :'<div class="erow" style="grid-template-columns:1fr"><span class="muted small">Noch keine Begriffe. Unten hinzufügen, Liste einfügen oder Seite fotografieren.</span></div>';
    box.querySelectorAll('.erow[data-c]').forEach(row=>{const cid=row.dataset.c,c=s.cards.find(x=>x.id===cid);
      row.querySelectorAll('textarea').forEach(ta=>{const fit=()=>{ta.style.height='auto';ta.style.height=ta.scrollHeight+2+'px'};fit();
        ta.oninput=()=>{fit();const v=ta.value.trim();if(v){c[ta.dataset.k]=v;qCard(cid)}};
        ta.onblur=()=>{if(!ta.value.trim())ta.value=c[ta.dataset.k]}});
      row.querySelector('[data-del]').onclick=()=>{const i=s.cards.indexOf(c);s.cards.splice(i,1);qDelCard(cid);qSet(s.id);drawRows();
        toast(`„${c.t}“ gelöscht`,{label:'Rückgängig',fn:()=>{s.cards.splice(i,0,c);qCard(cid);qSet(s.id);drawRows()}})};
      const fi=row.querySelector('[data-img]');fi&&(fi.onchange=e=>{const f=e.target.files[0];if(f)setCardImage(s.id,cid,f)});
      const rm=row.querySelector('[data-rmimg]');rm&&(rm.onclick=()=>removeCardImage(cid))});
    hydrateImgs()}
  drawRows();
}

// ================= Foto-Import =================
function vImport(){
  const v=S.view,s=S.sets[v.sid];
  const back=()=>go(v.back==='edit'?{name:'edit',sid:s.id}:{name:'set',sid:s.id});
  app.innerHTML=`<div class="row"><button class="ghost" id="back">← ${esc(s.name)}</button></div><h2>Seite fotografieren</h2>
  ${v.rows?'':`<div class="drop"><p style="margin:0"><strong>Fotografiere die Vokabelliste</strong> oder wähle Fotos bzw. Screenshots aus. Mehrere Seiten auf einmal gehen auch.</p>
    <p class="small muted" style="margin:0">Tipp: gerade von oben, gutes Licht, beide Spalten vollständig im Bild, keine Zeilen der nächsten Seite. Doppelte werden trotzdem erkannt.</p>
    <label class="btn primary" for="pics">Fotos wählen</label><input type="file" id="pics" accept="image/*" multiple hidden><div class="thumbs" id="thumbs"></div></div>
  <div class="row"><button class="primary" id="scan" ${v.files.length?'':'disabled'}>Begriffe erkennen</button><span class="small muted" id="scanst"></span></div>`}
  <div id="review"></div>`;
  $('#back').onclick=back;
  if(v.rows)return drawReview();
  const th=$('#thumbs');v.files.forEach(f=>{const i=new Image();i.src=URL.createObjectURL(f);i.alt='Foto';th.append(i)});
  $('#pics').onchange=e=>{v.files=[...v.files,...e.target.files];render()};
  $('#scan').onclick=async()=>{const btn=$('#scan'),st=$('#scanst');btn.disabled=true;const rows=[];
    for(let i=0;i<v.files.length;i++){st.textContent=`Lese Foto ${i+1} von ${v.files.length}…`;
      try{const img=await shrink(v.files[i],2000,3.5e6);
        const image=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(img)});
        const {data:res,error}=await S.sb.functions.invoke(SCAN_FUNCTION,{body:{image,mediaType:'image/jpeg',from:s.from,to:s.to}});
        if(error){let m=error.message;try{m=(await error.context.json()).error||m}catch(_){}throw{message:m}}
        (res?.pairs||[]).forEach(p=>p&&(p.term||p.definition)&&rows.push(p));
      }catch(e){toast(`Foto ${i+1}: ${e.message||'Erkennung fehlgeschlagen'}`)}}
    if(!rows.length){st.textContent='Keine Begriffe erkannt. Versuche ein schärferes Foto.';btn.disabled=false;return}
    v.result=autoImport(s,rows);v.rows=true;render()};
  function drawReview(){const r=v.result,ds=r.doubts;
    const parts=[];if(r.swapped)parts.push(`${r.swapped} vertauschte Spalten automatisch korrigiert`);if(r.skipped)parts.push(`${r.skipped} Doppelte übersprungen`);if(r.dropped)parts.push(`${r.dropped} leere Zeilen/Seitenzahlen verworfen`);
    $('#review').innerHTML=`<div class="panel"><h3>✓ ${r.added} Begriffe übernommen</h3>${parts.length?`<span class="small muted">${esc(parts.join(' · '))}</span>`:''}
    ${ds.length?`<div class="banner"><strong>Bei ${ds.length} ${ds.length===1?'Zeile':'Zeilen'} bin ich unsicher.</strong> Kurz entscheiden – alles andere ist schon drin.</div>
      <div class="rev">${ds.map((x,i)=>`<div class="panel" style="padding:10px;gap:6px" id="dz${i}"><span class="small" style="color:var(--bad)">⚠ ${esc(x.msg)}</span>
        <div class="two" style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input id="dt${i}" value="${esc(x.term)}" aria-label="${esc(s.from)}"><input id="dd${i}" value="${esc(x.definition)}" aria-label="${esc(s.to)}"></div>
        <div class="row"><button class="primary" data-ok="${i}">Übernehmen</button><button data-sw="${i}">Tauschen</button><button class="ghost" data-no="${i}">Verwerfen</button></div></div>`).join('')}</div>`:''}
    <div class="row"><button class="primary" id="fin">${ds.length?'Fertig (Rest verwerfen)':'Fertig'}</button><button class="ghost" id="more">Weitere Fotos</button></div></div>`;
    const done=i=>{ds.splice(i,1);drawReview()};
    $('#review').querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{const i=+b.dataset.ok;const x=addCards(s.id,[{term:$('#dt'+i).value,definition:$('#dd'+i).value}]);r.added+=x.added;r.skipped+=x.skipped;done(i)});
    $('#review').querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{const i=+b.dataset.sw;const t=$('#dt'+i).value;$('#dt'+i).value=$('#dd'+i).value;$('#dd'+i).value=t});
    $('#review').querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>done(+b.dataset.no));
    $('#fin').onclick=back;$('#more').onclick=()=>go({...v,files:[],rows:null,result:null})}
}

// ================= Lernmodi: Start =================
function startMode(sid,mode,opts={}){
  const s=S.sets[sid];if(!s||!s.cards.length)return;
  const base={sid,dir:opts.dir||S.user.settings?.dir||'fwd',star:!!opts.star,ids:opts.ids||null};
  if(mode==='flash')return go({name:'flash',...base,shuffle:!!opts.shuffle,track:opts.track!==false,srs:false,phase:'run'});
  if(mode==='srs')return go({name:'flash',...base,srs:true,track:true,shuffle:true,phase:'run'});
  if(mode==='learn')return go({name:'learn',...base,mc:true,write:true,phase:'setup'});
  if(mode==='test')return go({name:'test',...base,phase:'setup'});
  if(mode==='match')return go({name:'match',...base,phase:'intro'});
}
function studyHead(title,s,right=''){return`<div class="studyhead"><button class="ghost" id="quit">✕</button><div class="grow" style="min-width:0"><strong>${esc(title)}</strong><div class="small muted" style="overflow-wrap:anywhere">${esc(s.name)}</div></div>${right}</div>`}
const bindQuit=sid=>$('#quit').onclick=()=>{flush();go({name:'set',sid})};
function optionsHtml(v,s,extra=''){const starN=s.cards.filter(x=>isStar(s.id,x.id)).length;
  return`<div class="panel"><span class="lbl">Optionen</span>
  <label class="toggle" for="odir"><span>Abfragen</span><select id="odir" style="width:auto"><option value="fwd" ${v.dir==='fwd'?'selected':''}>${esc(s.from)} → ${esc(s.to)}</option><option value="rev" ${v.dir==='rev'?'selected':''}>${esc(s.to)} → ${esc(s.from)}</option><option value="mix" ${v.dir==='mix'?'selected':''}>Gemischt</option></select></label>
  <label class="toggle" for="ostar"><span>Nur markierte Begriffe (★ ${starN})</span><input type="checkbox" id="ostar" ${v.star?'checked':''} ${starN?'':'disabled'}></label>${extra}</div>`}
function bindOptions(v){$('#odir').onchange=e=>{v.dir=e.target.value;S.user.settings=S.user.settings||{};S.user.settings.dir=v.dir;qUser()};$('#ostar').onchange=e=>{v.star=e.target.checked;render()}}

// ================= Karteikarten =================

    <div class="face"><span class="lbl">${esc(sd.askL)}</span><span class="tools">${spk(sd.ask,sd.askL)}<button class="icon star" data-star="${c.id}" aria-pressed="${isStar(s.id,c.id)}" aria-label="Markieren">★</button></span><span class="w">${imgTag(sd.askImg)}<span>${esc(sd.ask)}</span></span></div>
    <div class="face back"><span class="lbl">${esc(sd.ansL)}</span><span class="tools">${spk(sd.ans,sd.ansL)}<button class="icon star" data-star="${c.id}" aria-pressed="${isStar(s.id,c.id)}" aria-label="Markieren">★</button></span><span class="w">${imgTag(sd.ansImg)}<span>${esc(sd.ans)}</span></span></div></div></div>`}
function vFlash(){
  const v=S.view,s=S.sets[v.sid];
  if(!v.deck){let cards=deckCards(s,v);
    if(v.srs){let due=dueCards(s);if(v.star)due=due.filter(x=>isStar(s.id,x.id));if(!due.length)due=cards.filter(c=>cp(s.id,c.id).box<=2);if(!due.length)due=[...cards].sort((a,b)=>cp(s.id,a.id).due-cp(s.id,b.id).due).slice(0,20);cards=shuffle(due).sort((a,b)=>cp(s.id,a.id).box-cp(s.id,b.id).box).slice(0,30)}

    v.deck=cards.map(c=>({id:c.id,rev:dirRev(v.dir)}));v.i=0;v.know=[];v.learn=[];v.hist=[];touchStudy(s.id,v.srs?'srs':'flash')}

    <div class="row">${l?`<button class="primary" id="again">Mit ${l} Karten weiterüben</button>`:''}<button id="restart">Karten zurücksetzen</button><button id="tolearn">Im Modus „Lernen“ üben</button><button class="ghost" id="fin">Fertig</button></div>`;

    $('#again')&&($('#again').onclick=()=>{const ids=v.learn;Object.assign(v,{deck:shuffle(ids).map(id=>({id,rev:dirRev(v.dir)})),i:0,know:[],learn:[],hist:[],phase:'run'});render()});
    $('#restart').onclick=()=>{v.deck=null;v.phase='run';render()};$('#tolearn').onclick=()=>startMode(s.id,'learn');$('#fin').onclick=()=>go({name:'set',sid:s.id});return}
  const it=v.deck[v.i],c=s.cards.find(x=>x.id===it.id);if(!c){v.i++;if(v.i>=v.deck.length)v.phase='done';return render()}
  const total=v.deck.length;
  app.innerHTML=`${studyHead(title,s,`<button class="icon" id="opts" aria-label="Optionen">⚙︎</button>`)}
  <div class="progress"><span style="width:${v.i/total*100}%"></span></div>
  ${v.track?`<div class="counts"><span class="l">${v.learn.length} lerne ich noch</span><span class="muted small">${v.i+1} / ${total}</span><span class="r">${v.know.length} weiß ich</span></div>`:`<div class="counts"><span></span><span class="muted small">${v.i+1} / ${total}</span><span></span></div>`}
  <div class="deck" id="deck">${flashCardHtml(s,c,it.rev)}</div>
  <p class="small muted" style="text-align:center;margin:0">${v.track?'Tippen zum Umdrehen · nach rechts wischen: weiß ich · nach links: lerne ich noch':'Tippen zum Umdrehen · wischen zum Blättern'}</p>
  <div class="fbtns"><button class="icon" id="undo" aria-label="Zurück" ${v.i?'':'disabled'}>↶</button>
    ${v.track?'<button id="no" style="color:var(--warn);border-color:var(--warn)">✕ Lerne ich noch</button><button id="yes" style="color:var(--ok);border-color:var(--ok)">✓ Weiß ich</button>':'<button id="prev">‹ Zurück</button><button id="next">Weiter ›</button>'}
    <button class="icon" id="shuf" aria-pressed="${!!v.shuffle}" aria-label="Mischen" title="Mischen" ${v.srs?'disabled':''}>⤮</button></div>`;
  bindQuit(s.id);
  const deck=$('#deck'),fc=deck.querySelector('.fcard');bindStar(deck,s);
  const flip=()=>fc.classList.toggle('flipped');
  if(S.user.settings?.autoAudio)speak(side(s,c,it.rev).ask,side(s,c,it.rev).askL);
  const act=know=>{if(!v.track){v.i=Math.max(0,Math.min(total,v.i+(know?1:-1)));if(v.i>=total)v.phase='done';return render()}
    v.hist.push({i:v.i,know,prev:JSON.stringify(cp(s.id,c.id))});(know?v.know:v.learn).push(c.id);grade(s.id,c.id,know);qProg(s.id);v.i++;if(v.i>=total)v.phase='done';render()};
  // Wischen
  let x0=null,dx=0,moved=false;
  fc.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;x0=e.clientX;dx=0;moved=false;fc.setPointerCapture(e.pointerId);fc.style.transition='none'});
  fc.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;if(Math.abs(dx)>6)moved=true;fc.style.transform=`translateX(${dx}px) rotate(${dx/25}deg)`;
    fc.classList.toggle('swipe-r',v.track&&dx>60);fc.classList.toggle('swipe-l',v.track&&dx<-60)});
  const end=()=>{if(x0===null)return;fc.style.transition='transform .2s';x0=null;
    if(Math.abs(dx)>90){fc.style.transform=`translateX(${dx>0?600:-600}px) rotate(${dx/10}deg)`;setTimeout(()=>act(v.track?dx>0:dx<0),160)}
    else{fc.style.transform='';fc.classList.remove('swipe-r','swipe-l');if(!moved)flip()}};
  fc.addEventListener('pointerup',end);fc.addEventListener('pointercancel',()=>{x0=null;fc.style.transform=''});
  fc.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();flip()}});
  if(v.track){$('#yes').onclick=()=>act(true);$('#no').onclick=()=>act(false)}else{$('#next').onclick=()=>act(true);$('#prev').onclick=()=>act(false)}
  $('#undo').onclick=()=>{if(!v.i)return;if(v.track){const h=v.hist.pop();if(h){(h.know?v.know:v.learn).pop();progOf(s.id).c[v.deck[h.i].id]=JSON.parse(h.prev);qProg(s.id);v.i=h.i}}else v.i--;render()};
  $('#shuf').onclick=()=>{v.shuffle=!v.shuffle;v.deck=null;render()};
  $('#opts').onclick=()=>openSheet(`<h3>Optionen</h3>${optionsHtml(v,s,`<label class="toggle" for="otr"><span>Fortschritt verfolgen (wischen = weiß ich / lerne ich noch)</span><input type="checkbox" id="otr" ${v.track?'checked':''} ${v.srs?'disabled':''}></label>
    <label class="toggle" for="oau"><span>Automatisch vorlesen</span><input type="checkbox" id="oau" ${S.user.settings?.autoAudio?'checked':''}></label>`)}<div class="row"><button class="primary" id="ook">Neu starten</button><button id="ox">Schließen</button></div>`,()=>{
      bindOptions(v);$('#otr').onchange=e=>v.track=e.target.checked;$('#oau').onchange=e=>{S.user.settings.autoAudio=e.target.checked;qUser()};
      $('#ook').onclick=()=>{v.deck=null;closeSheet();render()};$('#ox').onclick=closeSheet});
  document.onkeydown=e=>{if(S.view!==v||$('#sheet').innerHTML)return;if(e.target.matches('input,textarea,select'))return;
    if(e.key===' '){e.preventDefault();flip()}else if(e.key==='ArrowRight')act(true);else if(e.key==='ArrowLeft')act(false);else if(e.key==='z')$('#undo').click()};
}

// ================= Lernen (adaptiv) =================
function vLearn(){
  const v=S.view,s=S.sets[v.sid];
  if(v.phase==='setup'){
    app.innerHTML=`${studyHead('Lernen',s)}<h2>Lernen einrichten</h2>
    <p class="muted small" style="margin:0">Du lernst in Runden mit je 7 Begriffen. Jeder Begriff braucht zwei richtige Antworten in zwei Runden: erst auswählen (Multiple Choice), dann selbst schreiben. Danach gilt er als beherrscht. Falsche Antworten kommen in derselben Runde nochmal.</p>
    ${optionsHtml(v,s,`<span class="lbl" style="margin-top:6px">Fragetypen</span><div class="checks"><label><input type="checkbox" id="omc" ${v.mc?'checked':''}>Multiple Choice</label><label><input type="checkbox" id="owr" ${v.write?'checked':''}>Schreiben</label></div>`)}
    <button class="primary" id="go" style="justify-self:start">Lernen starten</button>`;
    bindQuit(s.id);bindOptions(v);
    $('#omc').onchange=e=>{v.mc=e.target.checked;if(!v.mc&&!v.write){v.write=true;$('#owr').checked=true}};
    $('#owr').onchange=e=>{v.write=e.target.checked;if(!v.mc&&!v.write){v.mc=true;$('#omc').checked=true}};
    if(s.cards.length<2){v.mc=false;$('#omc').checked=false;$('#omc').disabled=true}
    $('#go').onclick=()=>{v.phase='round';v.round=0;nextRound(v,s);touchStudy(s.id,'learn');render()};return}
  const pool=deckCards(s,v);
  const lvOf=id=>cp(s.id,id).lv||0;
  if(v.phase==='summary'||v.phase==='done'){
    const m=pool.filter(c=>lvOf(c.id)>=2).length,l=pool.filter(c=>lvOf(c.id)===1||(lvOf(c.id)===0&&cp(s.id,c.id).seen)).length,nn=pool.length-m-l;
    const done=v.phase==='done';
    app.innerHTML=`${studyHead('Lernen',s)}<h2>${done?'Alles beherrscht!':'Runde '+v.round+' geschafft'}</h2>
    <div class="bar3" style="height:10px"><span class="m" style="width:${m/pool.length*100}%"></span><span class="l" style="width:${l/pool.length*100}%"></span></div>
    <div class="stats"><div class="panel"><span class="lbl">Beherrscht</span><b style="font-family:var(--f-display);font-size:1.6rem;color:var(--ok)">${m}</b></div><div class="panel"><span class="lbl">Lernst du gerade</span><b style="font-family:var(--f-display);font-size:1.6rem;color:var(--warn)">${l}</b></div><div class="panel"><span class="lbl">Noch nicht gelernt</span><b style="font-family:var(--f-display);font-size:1.6rem">${nn}</b></div></div>
    ${v.roundCards?`<div class="terms">${v.roundCards.map(id=>{const c=s.cards.find(x=>x.id===id);return c?`<div class="term"><span class="t">${esc(c.t)}</span><span class="d">${esc(c.d)}</span><span class="chip ${lvOf(id)>=2?'g':'y'}">${lvOf(id)>=2?'beherrscht':'lernst du'}</span></div>`:''}).join('')}</div>`:''}
    <div class="row">${done?`<button class="primary" id="restart">Nochmal von vorn</button><button id="totest">Test machen</button>`:`<button class="primary" id="cont">Weiter zu Runde ${v.round+1}</button>`}<button class="ghost" id="fin">Fertig</button></div>`;
    bindQuit(s.id);
    $('#cont')&&($('#cont').onclick=()=>{nextRound(v,s);render()});
    $('#restart')&&($('#restart').onclick=()=>{pool.forEach(c=>cp(s.id,c.id).lv=0);qProg(s.id);v.round=0;nextRound(v,s);render()});
    $('#totest')&&($('#totest').onclick=()=>startMode(s.id,'test'));$('#fin').onclick=()=>go({name:'set',sid:s.id});
    document.onkeydown=e=>{if(e.key==='Enter'&&$('#cont'))$('#cont').click()};return}
  // Frage
  const q=v.queue[v.qi];const c=s.cards.find(x=>x.id===q.id);if(!c){v.qi++;return afterQ(v,s)}
  const lv=lvOf(c.id),type=(lv===0&&v.mc)||!v.write?'mc':'write';const sd=side(s,c,q.rev);
  const doneN=v.roundCards.filter(id=>v.doneIds.has(id)).length;
  app.innerHTML=`${studyHead('Lernen',s,`<span class="small muted">Runde ${v.round}</span>`)}
  <div class="progress"><span style="width:${doneN/v.roundCards.length*100}%"></span></div>
  <div class="prompt"><div class="row"><span class="lbl grow">${esc(sd.askL)}</span>${spk(sd.ask,sd.askL)}<button class="icon star" data-star="${c.id}" aria-pressed="${isStar(s.id,c.id)}" aria-label="Markieren">★</button></div>${imgTag(sd.askImg)}<span class="w">${esc(sd.ask)}</span></div>
  <div id="ans"></div><div id="fb"></div>`;
  bindQuit(s.id);bindStar(app,s);
  if(!q.state)q.state={done:false};
  const st=q.state;
  if(type==='mc'){
    if(!st.opts){const others=[...new Set(shuffle(s.cards.filter(x=>x.id!==c.id).map(x=>q.rev?x.t:x.d)).filter(x=>x!==sd.ans))].slice(0,3);st.opts=shuffle([sd.ans,...others])}
    $('#ans').innerHTML=`<span class="lbl">Wähle die richtige Antwort</span><div class="opts" style="margin-top:6px">${st.opts.map((o,i)=>{let cls='';if(st.done){if(o===sd.ans)cls='right';else if(i===st.pick)cls='wrong'}
      return`<button class="opt ${cls}" data-i="${i}" ${st.done?'disabled':''}><span class="k">${i+1}</span><span>${esc(o)}</span></button>`}).join('')}</div>`;
    const pick=i=>{if(st.done)return;st.done=true;st.pick=i;st.right=st.opts[i]===sd.ans;render()};
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
    document.onkeydown=e=>{if(S.view!==v)return;const n=+e.key;if(!st.done&&n>=1&&n<=st.opts.length)pick(n-1);else if(st.done&&(e.key==='Enter'||e.key===' ')){e.preventDefault();$('#next')?.click()}};
  }else{
    $('#ans').innerHTML=`<form id="wf" style="display:grid;gap:8px"><label class="lbl" for="win">Deine Antwort (${esc(sd.ansL)})</label>
      <input id="win" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(st.input||'')}" ${st.done?'disabled':''}>
      ${st.done?'':'<div class="row"><button class="primary">Antworten</button><button type="button" class="ghost" id="dunno">Weiß ich nicht</button></div>'}</form>`;
    if(!st.done){$('#win').focus();$('#wf').onsubmit=e=>{e.preventDefault();st.input=$('#win').value;if(!st.input.trim()){$('#win').focus();return}const r=check(st.input,sd.ans);st.r=r;st.right=r.res==='ok'||r.res==='almost';st.done=true;render()};
      $('#dunno').onclick=()=>{st.input='';st.r={res:'no'};st.right=false;st.done=true;render()}}
    document.onkeydown=e=>{if(S.view!==v)return;if(st.done&&e.key==='Enter'){e.preventDefault();$('#next')?.click()}};
  }
  if(st.done){
    const r=st.r;const cls=st.right?(r&&r.res==='almost'?'al':'ok'):'no';
    $('#fb').innerHTML=`<div class="fb ${cls}"><strong>${st.right?['Super!','Richtig!','Weiter so!','Genau!'][Math.random()*4|0]:r&&r.res==='typo'?'Fast. Tippfehler?':'Noch nicht ganz.'}</strong>
      ${r&&r.msg?`<span class="small">${esc(r.msg)}</span>`:''}${!st.right||type==='write'?`<span>Richtig: <strong>${esc(sd.ans)}</strong></span>`:''}${sd.ansImg&&!st.right?imgTag(sd.ansImg,'thumb'):''}</div>
      <div class="row" style="margin-top:8px"><button class="primary" id="next">Weiter</button>${!st.right&&type==='write'?'<button class="ghost" id="ovr">Ich hatte recht</button>':''}</div>`;
    hydrateImgs();
    $('#next').focus();$('#next').onclick=()=>commit(st.right);$('#ovr')&&($('#ovr').onclick=()=>commit(true));
  }
  function commit(right){const cc=cp(s.id,c.id);
    if(!q.graded){q.graded=true;grade(s.id,c.id,right)}
    if(right){if(!q.retry)cc.lv=Math.min(2,(cc.lv||0)+1);v.doneIds.add(c.id)}
    else{cc.lv=0;cc.seen=true;v.queue.push({id:c.id,rev:q.rev,retry:true})}
    qProg(s.id);v.qi++;afterQ(v,s)}
}
function nextRound(v,s){v.round++;const pool=deckCards(s,v);const lvOf=id=>cp(s.id,id).lv||0;
  const open=shuffle(pool.filter(c=>lvOf(c.id)<2)).sort((a,b)=>lvOf(b.id)-lvOf(a.id));
  if(!open.length){v.phase='done';v.roundCards=null;return}
  const pick=open.slice(0,7).map(c=>c.id);v.roundCards=pick;v.doneIds=new Set();v.queue=shuffle(pick).map(id=>({id,rev:dirRev(v.dir)}));v.qi=0;v.phase='q'}
function afterQ(v,s){
  // Runde ist vorbei, wenn jede Karte einmal (falsche zweimal) dran war
  const lvOf=id=>cp(s.id,id).lv||0;
  if(v.qi>=v.queue.length){const left=deckCards(s,v).filter(c=>lvOf(c.id)<2).length;v.phase=left?'summary':'done';return render()}
  render()}

// ================= Test =================
function vTest(){
  const v=S.view,s=S.sets[v.sid];const pool=deckCards(s,v);
  if(v.phase==='setup'){v.count=Math.min(v.count||20,pool.length||1);v.types=v.types||{tf:true,mc:true,write:true};
    app.innerHTML=`${studyHead('Test',s)}<h2>Test einrichten</h2>
    ${optionsHtml(v,s,`<label class="toggle" for="ocnt"><span>Anzahl Fragen (max. ${pool.length})</span><input type="number" id="ocnt" min="1" max="${pool.length}" value="${v.count}" style="width:90px"></label>
      <span class="lbl" style="margin-top:6px">Fragetypen</span><div class="checks"><label><input type="checkbox" data-ty="tf" ${v.types.tf?'checked':''}>Wahr oder falsch</label><label><input type="checkbox" data-ty="mc" ${v.types.mc?'checked':''}>Multiple Choice</label><label><input type="checkbox" data-ty="write" ${v.types.write?'checked':''}>Schreiben</label></div>`)}
    <button class="primary" id="go" style="justify-self:start">Test starten</button>`;
    bindQuit(s.id);bindOptions(v);
    $('#ocnt').oninput=e=>v.count=Math.max(1,Math.min(pool.length,+e.target.value||1));
    app.querySelectorAll('[data-ty]').forEach(b=>b.onchange=()=>{v.types[b.dataset.ty]=b.checked;if(!Object.values(v.types).some(Boolean)){v.types.write=true;render()}});
    $('#go').onclick=()=>{buildTest(v,s,pool);v.phase='run';v.t0=now();touchStudy(s.id,'test');render()};return}
  if(v.phase==='run'){
    const qs=v.qs;const answered=qs.filter(q=>q.a!=null&&q.a!=='').length;
    app.innerHTML=`${studyHead('Test',s,`<span class="small muted" id="tcount">${answered} / ${qs.length}</span>`)}
    <div class="progress"><span style="width:${answered/qs.length*100}%"></span></div>
    ${qs.map((q,i)=>{const c=s.cards.find(x=>x.id===q.id),sd=side(s,c,q.rev);
      const head=`<span class="num">${i+1} von ${qs.length} · ${{tf:'Wahr oder falsch',mc:'Multiple Choice',write:'Schreiben'}[q.type]}</span>`;
      let body='';
      if(q.type==='tf')body=`<div class="prompt"><span class="lbl">${esc(sd.askL)}</span>${imgTag(sd.askImg)}<span class="w">${esc(sd.ask)}</span><span class="lbl">${esc(sd.ansL)}</span><span>${esc(q.shown)}</span></div><div class="tf"><button class="choice" data-q="${i}" data-v="true" aria-pressed="${q.a===true}">Wahr</button><button class="choice" data-q="${i}" data-v="false" aria-pressed="${q.a===false}">Falsch</button></div>`;
      if(q.type==='mc')body=`<div class="prompt"><span class="lbl">${esc(sd.askL)}</span>${imgTag(sd.askImg)}<span class="w">${esc(sd.ask)}</span></div><div class="opts">${q.opts.map((o,j)=>`<button class="opt choice" data-q="${i}" data-j="${j}" aria-pressed="${q.a===j}"><span class="k">${j+1}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
      if(q.type==='write')body=`<div class="prompt"><span class="lbl">${esc(sd.askL)}</span>${imgTag(sd.askImg)}<span class="w">${esc(sd.ask)}</span></div><input data-w="${i}" value="${esc(q.a||'')}" placeholder="Antwort (${esc(sd.ansL)})" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Antwort Frage ${i+1}">`;
      return`<section class="q panel" id="q${i}">${head}${body}</section>`}).join('')}
    <div id="sub"></div><button class="primary" id="submit" style="justify-self:start">Test abschicken</button>`;
    bindQuit(s.id);
    app.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const q=qs[+b.dataset.q];q.a=b.dataset.v?b.dataset.v==='true':+b.dataset.j;
      b.parentElement.querySelectorAll('[data-q]').forEach(x=>x.setAttribute('aria-pressed',x===b));const n=qs.filter(q=>q.a!=null&&q.a!=='').length;$('#tcount').textContent=n+' / '+qs.length;app.querySelector('.progress span').style.width=n/qs.length*100+'%'});
    app.querySelectorAll('[data-w]').forEach(inp=>inp.oninput=()=>{qs[+inp.dataset.w].a=inp.value});
    $('#submit').onclick=()=>{const open=qs.filter(q=>q.a==null||q.a==='').length;
      if(open&&!v.warned){v.warned=true;$('#sub').innerHTML=`<div class="banner">${open} Fragen sind noch unbeantwortet. Nochmal tippen, um trotzdem abzuschicken.</div>`;return}
      gradeTest(v,s);v.phase='result';go(v)};return}
  // Ergebnis
  const qs=v.qs,ok=qs.filter(q=>q.ok).length,pct=Math.round(ok/qs.length*100),secs=Math.round((v.t1-v.t0)/1000);
  const R=46,C=2*Math.PI*R;
  app.innerHTML=`${studyHead('Test',s)}<h2>${pct>=90?'Hervorragend!':pct>=70?'Gut gemacht!':pct>=50?'Auf einem guten Weg':'Da geht noch was'}</h2>
  <div class="panel score"><svg class="ring" viewBox="0 0 110 110" role="img" aria-label="${pct} Prozent richtig"><circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--line)" stroke-width="10"/>${pct?'':'<!--'}<circle cx="55" cy="55" r="${R}" fill="none" stroke="${pct>=70?'var(--ok)':pct>=50?'var(--warn)':'var(--bad)'}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*pct/100} ${C}" transform="rotate(-90 55 55)"/>${pct?'':'-->'}<text x="55" y="62" text-anchor="middle" fill="var(--fg)" style="font:700 22px var(--f-display)">${pct}%</text></svg>
    <div style="display:grid;gap:4px"><span><strong style="color:var(--ok)">${ok} richtig</strong> · <strong style="color:var(--bad)">${qs.length-ok} falsch</strong></span><span class="small muted">Dauer: ${Math.floor(secs/60)} Min. ${secs%60} Sek.</span></div></div>
  <div class="row"><button class="primary" id="newt">Neuer Test</button>${qs.length-ok?`<button id="wrongs">Falsche mit Karteikarten üben</button>`:''}<button class="ghost" id="fin">Fertig</button></div>
  <div class="sec"><h3>Deine Antworten</h3></div>
  ${qs.map((q,i)=>{const c=s.cards.find(x=>x.id===q.id),sd=side(s,c,q.rev);
    let yours=q.a==null||q.a===''?'<em class="muted">keine Antwort</em>':q.type==='tf'?(q.a?'Wahr':'Falsch'):q.type==='mc'?esc(q.opts[q.a]):esc(q.a);
    return`<section class="panel res ${q.ok?'':'no'}"><span class="num small muted">${i+1} · ${q.ok?'Richtig':'Falsch'}</span><strong>${esc(sd.ask)}</strong>
    ${q.type==='tf'?`<span class="small">Aussage: ${esc(q.shown)}</span>`:''}<span class="small">Deine Antwort: ${yours}</span>${q.ok?'':`<span class="small">Richtig: <strong>${q.type==='tf'?(q.truth?'Wahr':'Falsch')+' – '+esc(sd.ans):esc(sd.ans)}</strong></span>`}</section>`}).join('')}`;
  bindQuit(s.id);
  $('#newt').onclick=()=>{v.phase='setup';v.warned=false;render()};$('#fin').onclick=()=>go({name:'set',sid:s.id});
  $('#wrongs')&&($('#wrongs').onclick=()=>startMode(s.id,'flash',{ids:qs.filter(q=>!q.ok).map(q=>q.id),dir:v.dir}));
}
function buildTest(v,s,pool){
  const picked=shuffle(pool).slice(0,v.count);const types=['tf','mc','write'].filter(t=>v.types[t]&&(t==='write'||s.cards.length>=2));if(!types.length)types.push('write');
  const per=Math.ceil(picked.length/types.length);
  v.qs=picked.map((c,i)=>{const type=types[Math.min(types.length-1,Math.floor(i/per))];const rev=dirRev(v.dir);const sd=side(s,c,rev);const q={id:c.id,type,rev,a:null};
    const others=[...new Set(shuffle(s.cards.filter(x=>x.id!==c.id).map(x=>rev?x.t:x.d)).filter(x=>x!==sd.ans))];
    if(type==='tf'){q.truth=Math.random()<.5||!others.length;q.shown=q.truth?sd.ans:others[0]}
    if(type==='mc')q.opts=shuffle([sd.ans,...others.slice(0,3)]);
    return q});
  v.warned=false}
function gradeTest(v,s){v.t1=now();v.qs.forEach(q=>{const c=s.cards.find(x=>x.id===q.id),sd=side(s,c,q.rev);
  if(q.type==='tf')q.ok=q.a===q.truth;else if(q.type==='mc')q.ok=q.a!=null&&q.opts[q.a]===sd.ans;else{const r=check(q.a||'',sd.ans);q.ok=r.res==='ok'||r.res==='almost'}})}

// ================= Zuordnen =================
function vMatch(){
  const v=S.view,s=S.sets[v.sid],p=progOf(s.id);const pool=deckCards(s,v);
  const fmt=ms=>(ms/1000).toFixed(1).replace('.',',')+' s';
  if(v.phase==='intro'||v.phase==='done'){
    const isDone=v.phase==='done',rec=isDone&&v.newBest;
    app.innerHTML=`${studyHead('Zuordnen',s)}
    ${isDone?`<h2>${rec?'Neue Bestzeit!':'Geschafft!'}</h2><div class="panel"><span class="lbl">Deine Zeit</span><span class="timer">${fmt(v.time)}</span>${v.pen?`<span class="small muted">inkl. ${v.pen} s Strafzeit für Fehler</span>`:''}</div>`
      :`<h2>Bereit zum Zuordnen?</h2><p class="muted" style="margin:0">Ordne alle Begriffe so schnell wie möglich ihrer Definition zu. Jeder Fehler kostet eine Sekunde extra.</p>`}
    ${p.best?`<span class="small muted">Bestzeit: ${fmt(p.best)}</span>`:''}
    ${optionsHtml(v,s)}
    <div class="row"><button class="primary" id="go">${isDone?'Nochmal spielen':'Spiel starten'}</button>${isDone?'<button class="ghost" id="fin">Fertig</button>':''}</div>`;
    bindQuit(s.id);bindOptions(v);$('#fin')&&($('#fin').onclick=()=>go({name:'set',sid:s.id}));
    $('#go').onclick=()=>{const pick=shuffle(pool).slice(0,Math.min(6,pool.length));
      v.tiles=shuffle(pick.flatMap(c=>{const rev=v.dir==='rev';return[{k:c.id,txt:rev?c.d:c.t,img:null},{k:c.id,txt:rev?c.t:c.d,img:rev?null:c.img}]})).map((t,i)=>({...t,i}));
      v.left=pick.length;v.sel=null;v.pen=0;v.t0=performance.now();v.phase='play';touchStudy(s.id,'match');render()};return}
  app.innerHTML=`${studyHead('Zuordnen',s,`<span class="timer" id="tm">0,0 s</span>`)}
  <div class="mgrid">${v.tiles.map(t=>`<button class="tile" data-i="${t.i}">${t.img?imgTag(t.img,'thumb'):''}<span>${esc(t.txt)}</span></button>`).join('')}</div>`;
  bindQuit(s.id);
  const tm=$('#tm');const tick=()=>{if(S.view!==v||v.phase!=='play')return;tm.textContent=fmt(performance.now()-v.t0+v.pen*1000);requestAnimationFrame(tick)};tick();
  app.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const t=v.tiles[+b.dataset.i];if(b.classList.contains('gone'))return;
    if(v.sel===null){v.sel=t.i;b.classList.add('sel');return}
    if(v.sel===t.i){v.sel=null;b.classList.remove('sel');return}
    const a=v.tiles[v.sel],ab=app.querySelector(`.tile[data-i="${v.sel}"]`);v.sel=null;ab.classList.remove('sel');
    if(a.k===t.k){ab.classList.add('gone');b.classList.add('gone');v.left--;
      if(!v.left){v.time=performance.now()-v.t0+v.pen*1000;v.newBest=!p.best||v.time<p.best;if(v.newBest){p.best=Math.round(v.time);qProg(s.id)}v.phase='done';render()}}
    else{v.pen++;[ab,b].forEach(x=>{x.classList.remove('bad');void x.offsetWidth;x.classList.add('bad')});setTimeout(()=>[ab,b].forEach(x=>x.classList.remove('bad')),350)}});
  hydrateImgs();
}

// ================= Start der App =================
async function startSession(user){
  S.uid=user.id;S.email=user.email||'';
  const c=cacheRead();
  if(c){S.sets=c.sets||{};S.prog=c.prog||{};S.user=Object.assign({folders:[],settings:{}},c.user||{});S.server=new Set(c.server||[]);
    const p=c.P||{};(p.sets||[]).forEach(x=>P.sets.add(x));(p.cards||[]).forEach(x=>P.cards.add(x));(p.delCards||[]).forEach(x=>P.delCards.add(x));(p.delSets||[]).forEach(x=>P.delSets.add(x));(p.prog||[]).forEach(x=>P.prog.add(x));P.user=!!p.user}
  S.view={name:'home'};render();
  await loadAll();
}
async function init(){
  if(!window.supabase){app.innerHTML='<div class="banner err">Die App konnte nicht geladen werden. Bitte Internetverbindung prüfen und neu laden.</div>';return}
  S.sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data:{session}}=await S.sb.auth.getSession();
  if(session)startSession(session.user);else renderLogin();
  S.sb.auth.onAuthStateChange((ev,sess)=>{if(ev==='SIGNED_IN'&&sess&&S.uid!==sess.user.id)startSession(sess.user)});
}
init();
</script>
